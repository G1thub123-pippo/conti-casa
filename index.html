<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Conti Famiglia</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2d6a4f">
<meta name="mobile-web-app-capable" content="true">
<meta name="apple-mobile-web-app-capable" content="true">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Conti Famiglia">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f0f4f1;color:#1a2e22;min-height:100vh;overflow-x:hidden}
:root{
  --bg:#f0f4f1;--bg2:#e4ede6;--surface:#fff;--surface2:#f7faf8;
  --primary:#2d6a4f;--primary-light:#52b788;--primary-pale:#d8f3dc;
  --accent:#f77f00;--text:#1a2e22;--text2:#4a6355;--muted:#8aab96;
  --green:#2d9e5f;--red:#e05252;--green-pale:#e8f8ef;--red-pale:#fdeaea;
  --radius:14px;--shadow:0 2px 12px rgba(45,106,79,.10);
}
#appbar{
  position:fixed;top:0;left:0;right:0;z-index:100;
  background:var(--primary);color:#fff;
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));
  box-shadow:0 2px 8px rgba(45,106,79,.25);
}
#appbar-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
#appbar-emoji{font-size:22px;line-height:1}
#appbar-title{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#appbar-sub{font-size:11px;color:rgba(255,255,255,.75);margin-top:1px}
#appbar-right{display:flex;align-items:center;gap:10px}
#syncDot{width:8px;height:8px;border-radius:50%;background:#666;transition:background .3s;flex-shrink:0}
#btn-edit{background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer}
#ver-tag{font-size:10px;color:rgba(255,255,255,.5);margin-left:4px;align-self:flex-end;padding-bottom:1px}

#tabs{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:#fff;display:flex;border-top:1px solid #d4e8da;
  padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -2px 10px rgba(45,106,79,.08);
}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:8px 4px;cursor:pointer;color:var(--muted);font-size:10px;font-weight:600;gap:3px;
  border:none;background:none;transition:color .2s;}
.tab.active{color:var(--primary)}
.tab-icon{font-size:20px;line-height:1}

#content{
  margin-top:calc(60px + env(safe-area-inset-top));
  margin-bottom:calc(64px + env(safe-area-inset-bottom));
  padding:14px;min-height:100vh;
}

.chip-bar{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chip-bar::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;
  cursor:pointer;border:1.5px solid var(--primary);background:#fff;color:var(--primary);transition:all .15s;}
.chip.active{background:var(--primary);color:#fff}

.anno-chip-bar{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.anno-chip-bar::-webkit-scrollbar{display:none}
.anno-chip{flex-shrink:0;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;
  cursor:pointer;border:1.5px solid var(--primary-light);background:#fff;color:var(--primary);}
.anno-chip.active{background:var(--primary-light);color:#fff;border-color:var(--primary-light)}
.anno-chip.archiviato{border-style:dashed;opacity:.85}

/* GRIGLIA MESI */
.mesi-grid{
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;
  margin-bottom:14px;
}
.mese-box{
  background:var(--surface);border-radius:12px;box-shadow:var(--shadow);
  padding:12px 10px;cursor:pointer;transition:transform .12s, box-shadow .12s;
  border:2px solid transparent;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:4px;
}
.mese-box:active{transform:scale(.96)}
.mese-box.corrente{border-color:var(--primary-light)}
.mese-box.vuoto{opacity:.55}
.mese-box.readonly{cursor:default;opacity:.75}
.mese-nome{font-size:13px;font-weight:800;color:var(--text);letter-spacing:.01em}
.mese-ent{font-size:11px;font-weight:700;color:var(--green);letter-spacing:-.01em}
.mese-usc{font-size:11px;font-weight:700;color:var(--red);letter-spacing:-.01em}
.mese-saldo{font-size:13px;font-weight:800;margin-top:2px}
.mese-saldo.pos{color:var(--green)}.mese-saldo.neg{color:var(--red)}
.mese-saldo.zero{color:var(--muted)}
.mese-vuoto-label{font-size:11px;color:var(--muted);margin-top:2px}

/* VISTA MESE DETTAGLIO */
.mese-header{
  display:flex;align-items:center;gap:10px;margin-bottom:14px;
}
.btn-back{background:var(--primary-pale);border:none;border-radius:8px;
  padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer;color:var(--primary);flex-shrink:0;}
.mese-header-title{font-size:16px;font-weight:800;color:var(--text)}
.mese-totali{
  background:var(--primary);color:#fff;border-radius:var(--radius);
  padding:12px 16px;margin-bottom:12px;
  display:flex;justify-content:space-between;align-items:center;
}
.mt-item{text-align:center;flex:1}
.mt-label{font-size:10px;opacity:.75;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.mt-val{font-size:15px;font-weight:800;margin-top:2px}
.mt-val.pos{color:#a7f3c8}.mt-val.neg{color:#fca5a5}
.mt-val.sp{color:#fff}.mt-val.sn{color:#fca5a5}
.mt-sep{width:1px;background:rgba(255,255,255,.2);align-self:stretch}

.voce-card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);
  margin-bottom:10px;display:flex;align-items:center;padding:13px 14px;gap:12px;}
.voce-card.readonly{opacity:.8}
.voce-card-left{flex:1;min-width:0}
.voce-cat{font-size:11px;font-weight:700;color:var(--primary-light);text-transform:uppercase;letter-spacing:.03em}
.voce-desc{font-size:14px;font-weight:600;color:var(--text);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.voce-meta{font-size:11px;color:var(--muted);margin-top:3px}
.voce-imp{font-size:16px;font-weight:800;flex-shrink:0}
.voce-imp.pos{color:var(--green)}.voce-imp.neg{color:var(--red)}
.voce-edit-btn{background:none;border:none;font-size:18px;cursor:pointer;color:var(--muted);padding:4px;flex-shrink:0}

/* BILANCIO */
.totali-bar{background:var(--primary);color:#fff;border-radius:var(--radius);
  padding:16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;}
.totale-item{text-align:center;flex:1}
.totale-label{font-size:10px;opacity:.75;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.totale-val{font-size:17px;font-weight:800;margin-top:3px}
.totale-val.pos{color:#a7f3c8}.totale-val.neg{color:#fca5a5}
.totale-val.saldo-pos{color:#fff}.totale-val.saldo-neg{color:#fca5a5}
.totale-sep{width:1px;background:rgba(255,255,255,.2);align-self:stretch}

.bil-card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden;}
.bil-card-head{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;cursor:pointer;}
.bil-cat-nome{font-size:14px;font-weight:700;color:var(--text)}
.bil-cat-count{font-size:12px;color:var(--muted);margin-top:2px}
.bil-cat-val{font-size:16px;font-weight:800}
.bil-voci{border-top:1px solid var(--bg2)}
.bil-voce-row{display:flex;align-items:center;justify-content:space-between;
  padding:9px 14px;border-bottom:1px solid var(--bg);}
.bil-voce-row:last-child{border-bottom:none}
.bil-voce-desc{font-size:13px;color:var(--text2);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bil-voce-meta{font-size:11px;color:var(--muted)}
.bil-voce-imp{font-size:13px;font-weight:700;flex-shrink:0;margin-left:8px}

.banner-archivio{
  background:#fff8e1;border:1.5px solid #f0c040;border-radius:var(--radius);
  padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.banner-archivio span{font-size:13px;font-weight:600;color:#7a5800}
.btn-disarchivia{background:#f0c040;border:none;border-radius:8px;padding:7px 12px;
  font-size:12px;font-weight:700;cursor:pointer;color:#4a3500;flex-shrink:0}

.btn-archivia{
  width:100%;padding:12px;border-radius:var(--radius);
  border:1.5px dashed var(--muted);background:#fff;
  font-size:13px;font-weight:600;cursor:pointer;color:var(--text2);
  margin-top:8px;transition:all .15s;
}
.btn-archivia:active{background:var(--bg2)}

/* FAB */
#fab{position:fixed;right:18px;bottom:calc(72px + env(safe-area-inset-bottom));
  width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;
  font-size:28px;border:none;cursor:pointer;
  box-shadow:0 4px 16px rgba(247,127,0,.45);
  display:flex;align-items:center;justify-content:center;
  z-index:99;transition:transform .15s;}
#fab:active{transform:scale(.92)}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s;}
.modal-bg.open{opacity:1;pointer-events:all}
.modal{background:#fff;border-radius:20px 20px 0 0;
  padding:20px 18px;padding-bottom:calc(20px + env(safe-area-inset-bottom));
  width:100%;max-width:540px;max-height:92vh;overflow-y:auto;
  transform:translateY(100%);transition:transform .25s;}
.modal-bg.open .modal{transform:translateY(0)}
.modal-title{font-size:17px;font-weight:700;color:var(--text);margin-bottom:16px}
.modal-close{float:right;background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted);margin-top:-4px}
.form-group{margin-bottom:14px}
.form-label{font-size:12px;font-weight:700;color:var(--text2);margin-bottom:5px;display:block}
.form-control{width:100%;padding:11px 12px;border-radius:10px;
  border:1.5px solid var(--bg2);background:var(--surface2);
  font-size:14px;color:var(--text);outline:none;transition:border-color .15s;font-family:inherit;}
.form-control:focus{border-color:var(--primary)}
.form-row{display:flex;gap:10px}
.form-row .form-group{flex:1}
.sign-toggle{display:flex;gap:8px;margin-bottom:16px}
.sign-btn{flex:1;padding:12px;border-radius:10px;border:2px solid var(--bg2);
  font-size:14px;font-weight:700;cursor:pointer;background:#fff;transition:all .15s;}
.sign-btn.ent{border-color:var(--green);background:var(--green-pale);color:var(--green)}
.sign-btn.usc{border-color:var(--red);background:var(--red-pale);color:var(--red)}
.btn-full{width:100%;padding:13px;border-radius:10px;background:var(--primary);color:#fff;
  border:none;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px;transition:opacity .15s;}
.btn-full:active{opacity:.8}
.btn-full.danger{background:var(--red)}
.btn-sm{padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;border:none;cursor:pointer}
.btn-ghost{background:var(--primary-pale);color:var(--primary)}
.btn-danger{background:var(--red-pale);color:var(--red)}
.importo-wrap{position:relative;margin-bottom:14px}
.importo-wrap input{width:100%;padding:16px 12px 16px 32px;border-radius:10px;
  border:1.5px solid var(--bg2);background:var(--surface2);
  font-size:28px;font-weight:800;color:var(--text);outline:none;
  transition:border-color .15s;font-family:inherit;}
.importo-wrap input:focus{border-color:var(--primary)}
.importo-euro{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:22px;font-weight:700;color:var(--muted)}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty-icon{font-size:48px;margin-bottom:12px}
.empty-text{font-size:15px;font-weight:600}
.empty-sub{font-size:13px;margin-top:6px}
.cat-item{display:flex;align-items:center;justify-content:space-between;
  padding:12px 14px;background:#fff;border-radius:10px;margin-bottom:8px;box-shadow:var(--shadow);}
.cat-nome{font-size:14px;font-weight:600}
.cat-actions{display:flex;gap:6px}
.ente-item{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ente-item input{flex:1}
.condividi-btn{display:flex;align-items:center;gap:8px;width:100%;padding:12px 14px;
  border-radius:10px;border:1.5px solid var(--bg2);background:#fff;
  font-size:14px;font-weight:600;cursor:pointer;margin-bottom:8px;
  color:var(--text);text-align:left;transition:background .15s;}
.condividi-btn:active{background:var(--bg2)}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--bg2);border-radius:2px}
/* SCONTRINI */
.sc-azioni{display:flex;gap:8px;margin-bottom:12px}
.sc-azioni button{flex:1;padding:11px 6px;border-radius:10px;border:1.5px solid var(--primary);
  background:#fff;color:var(--primary);font-size:13px;font-weight:700;cursor:pointer}
.sc-azioni button.pieno{background:var(--primary);color:#fff}
.sc-row{cursor:pointer}
.sc-badge{color:var(--accent)}
#m-anteprima .modal{max-width:640px;height:94vh;max-height:94vh;display:flex;flex-direction:column;padding:14px 12px}
#anteprima-pagine{flex:1;overflow-y:auto;background:#cfd8d2;border-radius:10px;padding:10px;margin:6px 0 10px}
#anteprima-pagine canvas{width:100%;display:block;background:#fff;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.anteprima-bottoni{display:flex;gap:8px}
.anteprima-bottoni .btn-full{margin-top:0}
.sc-preview{width:100%;max-height:45vh;object-fit:contain;border-radius:10px;background:var(--bg2);margin-bottom:14px;display:block}
.sc-check{display:flex;align-items:center;gap:10px;padding:12px;border-radius:10px;
  background:var(--primary-pale);font-size:14px;font-weight:700;color:var(--primary);margin-bottom:14px;cursor:pointer}
.sc-check input{width:20px;height:20px;accent-color:var(--primary);flex-shrink:0}
#m-crop{background:#111;align-items:stretch;z-index:300}
#m-crop .crop-box{display:flex;flex-direction:column;width:100%;height:100%;
  padding:calc(10px + env(safe-area-inset-top)) 10px calc(12px + env(safe-area-inset-bottom))}
#crop-titolo{color:#fff;font-size:14px;font-weight:700;text-align:center;margin-bottom:8px}
#crop-area{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
#crop-canvas{touch-action:none;max-width:100%;max-height:100%}
.crop-bottoni{display:flex;gap:8px;margin-top:10px}
.crop-bottoni button{flex:1;padding:13px 6px;border-radius:10px;border:none;font-size:14px;font-weight:700;cursor:pointer}
.crop-ok{background:var(--primary-light);color:#fff}
.crop-alt{background:#333;color:#fff}
.pers-check{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;
  border:1.5px solid var(--bg2);margin-bottom:6px;font-size:14px;font-weight:600;cursor:pointer}
.pers-check input{width:18px;height:18px;accent-color:var(--primary)}
.sc-wait{text-align:center;padding:30px;color:var(--muted);font-weight:600}
#banner-update{
  position:fixed;top:calc(60px + env(safe-area-inset-top));left:0;right:0;z-index:150;
  background:var(--accent);color:#fff;
  display:none;align-items:center;justify-content:space-between;
  padding:10px 16px;gap:10px;
  box-shadow:0 2px 8px rgba(247,127,0,.35);
}
#banner-update span{font-size:13px;font-weight:600}
#banner-update button{background:rgba(255,255,255,.25);border:none;color:#fff;
  border-radius:8px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;flex-shrink:0}
</style>
</head>
<body>

<div id="appbar">
  <div id="appbar-left">
    <span id="appbar-emoji">🏠</span>
    <div>
      <div style="display:flex;align-items:baseline;gap:6px">
        <div id="appbar-title">Conti Famiglia</div>
        <span id="ver-tag">v1.10.0</span>
      </div>
      <div id="appbar-sub"></div>
    </div>
  </div>
  <div id="appbar-right">
    <div id="syncDot" title="Connessione"></div>
    <button id="btn-edit" onclick="apriImp()">✏️</button>
  </div>
</div>

<div id="banner-update">
  <span id="banner-text">🔄 Aggiornamento disponibile</span>
  <button onclick="aggiornaApp()">Aggiorna</button>
</div>
<div id="content"></div>
<button id="fab" onclick="apriFab()" title="Aggiungi">+</button>

<div id="tabs">
  <button class="tab active" id="tab-movimenti" onclick="setTab('movimenti')">
    <span class="tab-icon">📋</span>Movimenti
  </button>
  <button class="tab" id="tab-bilancio" onclick="setTab('bilancio')">
    <span class="tab-icon">📊</span>Bilancio
  </button>
  <button class="tab" id="tab-scontrini" onclick="setTab('scontrini')">
    <span class="tab-icon">🧾</span>Detrazioni
  </button>
  <button class="tab" id="tab-categorie" onclick="setTab('categorie')">
    <span class="tab-icon">🏷️</span>Categorie
  </button>
</div>

<!-- MODAL VOCE -->
<div class="modal-bg" id="m-voce" onclick="chiudi('m-voce',event)">
  <div class="modal">
    <button class="modal-close" onclick="chiudi('m-voce')">×</button>
    <div class="modal-title" id="m-voce-title">Nuovo movimento</div>
    <div class="sign-toggle">
      <button class="sign-btn" id="btn-usc" onclick="setSegno(-1)">－ Uscita</button>
      <button class="sign-btn" id="btn-ent" onclick="setSegno(1)">＋ Entrata</button>
    </div>
    <div class="importo-wrap">
      <span class="importo-euro">€</span>
      <input id="v-importo" type="number" step="0.01" min="0" placeholder="0,00" inputmode="decimal">
    </div>
    <div class="form-group">
      <label class="form-label">Categoria</label>
      <select class="form-control" id="v-cat"></select>
    </div>
    <div class="form-group">
      <label class="form-label">Descrizione</label>
      <input class="form-control" id="v-desc" placeholder="es. Supermercato…">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Data</label>
        <input class="form-control" id="v-data" type="date">
      </div>
      <div class="form-group" id="v-membro-group">
        <label class="form-label">Membro</label>
        <select class="form-control" id="v-membro"></select>
      </div>
    </div>
    <button class="btn-full" onclick="salvaVoce()">Salva</button>
    <button class="btn-full danger" id="btn-del-voce" style="margin-top:8px;display:none" onclick="eliminaVoce()">Elimina</button>
  </div>
</div>

<!-- MODAL CATEGORIA -->
<div class="modal-bg" id="m-cat" onclick="chiudi('m-cat',event)">
  <div class="modal">
    <button class="modal-close" onclick="chiudi('m-cat')">×</button>
    <div class="modal-title" id="m-cat-title">Nuova categoria</div>
    <div class="form-group">
      <label class="form-label">Nome categoria</label>
      <input class="form-control" id="cat-nome" placeholder="es. Alimentari…">
    </div>
    <button class="btn-full" onclick="salvaCat()">Salva</button>
    <button class="btn-full danger" id="btn-del-cat" style="margin-top:8px;display:none" onclick="eliminaCat()">Elimina categoria</button>
  </div>
</div>

<!-- MODAL IMPOSTAZIONI -->
<div class="modal-bg" id="m-imp" onclick="chiudi('m-imp',event)">
  <div class="modal">
    <button class="modal-close" onclick="chiudi('m-imp')">×</button>
    <div class="modal-title">Impostazioni</div>
    <div class="form-row">
      <div class="form-group" style="flex:0 0 70px">
        <label class="form-label">Emoji</label>
        <input class="form-control" id="imp-emoji" maxlength="4" style="text-align:center;font-size:20px">
      </div>
      <div class="form-group">
        <label class="form-label">Titolo app</label>
        <input class="form-control" id="imp-titolo">
      </div>
    </div>
    <div class="form-label" style="margin-bottom:8px">Membri / Conti</div>
    <div id="enti-list"></div>
    <button class="btn-sm btn-ghost" onclick="addEnte()" style="margin-bottom:14px">+ Aggiungi membro</button>
    <button class="btn-full" onclick="salvaImp()">Salva impostazioni</button>
    <div style="margin-top:16px;border-top:1px solid var(--bg2);padding-top:14px">
      <div class="form-label" style="margin-bottom:8px">Dati</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">

<script>
const APP_VERSION = '1.10.0';
const MESI_NOMI = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno',
                   'Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];

// ── STATO ────────────────────────────────────────────────────
let categorie    = ['Alimentari','Casa','Trasporti','Salute','Svago','Abbigliamento','Utenze','Altro'];
let voci         = [];
let intestazione = ['Famiglia'];
let catDetr      = ['Mediche','Altro'];
let titoloApp    = 'Conti Famiglia';
let emojiApp     = '🏠';

let tab          = 'movimenti';
let enteIdx      = 0;
let annoCorrente = new Date().getFullYear();
let meseAperto   = null; // null = griglia, 0-11 = mese aperto
let bilExpand    = {};
let _editId      = null;
let _segno       = -1;
let _editCatIdx  = null;
let _archivioCache = {};

// ── FIREBASE QUEUE ───────────────────────────────────────────
let _fbSalva = null, _fbCoda = null;
let _fbArchivia = null, _fbDisarchivia = null;

window._getStato = ()=>({categorie, voci, intestazione, titoloApp, emojiApp, catDetr});
window._fbPronto = fn=>{ _fbSalva=fn; if(_fbCoda){_fbSalva(window._getStato());_fbCoda=null;} };
window._fbProntoArchivio = (fa, fd)=>{ _fbArchivia=fa; _fbDisarchivia=fd; };
window.applicaDati = d=>{
  if(d.categorie)    categorie=d.categorie;
  if(d.voci)         voci=d.voci;
  if(d.intestazione) intestazione=d.intestazione;
  if(d.titoloApp)    titoloApp=d.titoloApp;
  if(d.emojiApp)     emojiApp=d.emojiApp;
  if(Array.isArray(d.catDetr)&&d.catDetr.length) catDetr=d.catDetr;
  if(enteIdx>=intestazione.length) enteIdx=0;
  render();
};
window.applicaArchivi = cache=>{ _archivioCache=cache; render(); };
window.setSyncStatus = s=>{
  const el=document.getElementById('syncDot'); if(!el) return;
  el.style.background={ok:'#52b788',saving:'#f0a800',err:'#e05252'}[s]||'#666';
  el.title={ok:'Sincronizzato',saving:'Salvataggio…',err:'Offline'}[s]||'';
};

// ── LOCALE ───────────────────────────────────────────────────
function salvaLocale(){
  try{
    localStorage.setItem('cf_cat',    JSON.stringify(categorie));
    localStorage.setItem('cf_voci',   JSON.stringify(voci));
    localStorage.setItem('cf_int',    JSON.stringify(intestazione));
    localStorage.setItem('cf_titolo', titoloApp);
    localStorage.setItem('cf_emoji',  emojiApp);
    localStorage.setItem('cf_catdetr',JSON.stringify(catDetr));
    localStorage.setItem('cf_lastSave', new Date().toISOString());
  }catch{}
}
function caricaLocale(){
  try{
    const c=localStorage.getItem('cf_cat');   if(c) categorie=JSON.parse(c);
    const v=localStorage.getItem('cf_voci');  if(v) voci=JSON.parse(v);
    const i=localStorage.getItem('cf_int');   if(i) intestazione=JSON.parse(i);
    const t=localStorage.getItem('cf_titolo');if(t) titoloApp=t;
    const e=localStorage.getItem('cf_emoji'); if(e) emojiApp=e;
    const cd=localStorage.getItem('cf_catdetr'); if(cd) catDetr=JSON.parse(cd);
  }catch{}
}
async function saveOPFS(){
  try{
    const root=await navigator.storage.getDirectory();
    const fh=await root.getFileHandle('cf_backup.json',{create:true});
    const w=await fh.createWritable();
    await w.write(JSON.stringify({categorie,voci,intestazione,titoloApp,emojiApp,savedAt:new Date().toISOString()}));
    await w.close();
  }catch{}
}
function salva(){
  salvaLocale(); saveOPFS();
  const s=window._getStato();
  if(_fbSalva) _fbSalva(s); else _fbCoda=s;
}
function nextId(){ return voci.length ? Math.max(...voci.map(v=>v.id||0))+1 : 1; }
function annoVoce(v){ return parseInt((v.annoBilancio||v.data||'').slice(0,4))||0; }
function meseVoce(v){ return parseInt((v.data||'').slice(5,7))-1; } // 0-11

function isArchiviato(anno){ return !!_archivioCache[String(anno)]; }

function tuttiGliAnni(vociFiltrate){
  const daVoci=[...new Set(vociFiltrate.map(v=>annoVoce(v)).filter(Boolean))];
  const daArchivio=Object.keys(_archivioCache).map(Number);
  // includi sempre l'anno corrente
  const annoOggi=new Date().getFullYear();
  return [...new Set([...daVoci,...daArchivio,annoOggi])].sort().reverse();
}

// ── RENDER PRINCIPALE ────────────────────────────────────────
function render(){
  renderAppbar();
  if(tab==='movimenti')     renderMovimenti();
  else if(tab==='bilancio') renderBilancio();
  else if(tab==='scontrini') renderScontrini();
  else                      renderCategorie();
}
function renderAppbar(){
  document.getElementById('appbar-emoji').textContent=emojiApp;
  document.getElementById('appbar-title').textContent=titoloApp;
  document.getElementById('appbar-sub').textContent=intestazione.length>1?intestazione[enteIdx]:'';
}
function setTab(t){
  tab=t; meseAperto=null;
  document.querySelectorAll('.tab').forEach(el=>el.classList.remove('active'));
  document.getElementById('tab-'+t).classList.add('active');
  render();
}

// ── MOVIMENTI: GRIGLIA MESI ──────────────────────────────────
function renderMovimenti(){
  const readonly=isArchiviato(annoCorrente);
  document.getElementById('fab').style.display= meseAperto!==null && !readonly ? 'flex' : 'none';

  if(meseAperto!==null){ renderMeseDettaglio(meseAperto); return; }

  const ente=intestazione[enteIdx]||'';
  const vociFiltrate=voci.filter(v=>intestazione.length===1||!v.membro||v.membro===ente);
  const anni=tuttiGliAnni(vociFiltrate);
  if(!anni.includes(annoCorrente)) annoCorrente=anni[0]||new Date().getFullYear();

  // voci anno (correnti o archiviate)
  let voceAnno;
  if(readonly){
    voceAnno=(_archivioCache[String(annoCorrente)]||[])
      .filter(v=>intestazione.length===1||!v.membro||v.membro===ente);
  } else {
    voceAnno=vociFiltrate.filter(v=>annoVoce(v)===annoCorrente);
  }

  const _oggi=new Date();
  const _meseOggi=_oggi.getMonth(); // 0-11
  const _annoOggi=_oggi.getFullYear();

  let h='';
  // chip enti
  if(intestazione.length>1){
    h+='<div class="chip-bar">';
    intestazione.forEach((e,i)=>h+=`<button class="chip${i===enteIdx?' active':''}" onclick="setEnte(${i})">${e}</button>`);
    h+='</div>';
  }
  // chip anni
  h+='<div class="anno-chip-bar">';
  anni.forEach(a=>{
    const arch=isArchiviato(a);
    h+=`<button class="anno-chip${a===annoCorrente?' active':''}${arch?' archiviato':''}" onclick="setAnno(${a})">${arch?'📦 ':''}${a}</button>`;
  });
  h+='</div>';

  // banner archivio
  if(readonly){
    h+=`<div class="banner-archivio">
      <span>📦 Archivio ${annoCorrente} — sola lettura</span>
      <button class="btn-disarchivia" onclick="disarchivia(${annoCorrente})">↩️ Disarchivia</button>
    </div>`;
  }

  // griglia mesi
  h+='<div class="mesi-grid">';
  for(let m=0;m<12;m++){
    const voceM=voceAnno.filter(v=>meseVoce(v)===m);
    const ent=voceM.filter(v=>v.importo>=0).reduce((s,v)=>s+v.importo,0);
    const usc=voceM.filter(v=>v.importo<0).reduce((s,v)=>s+v.importo,0);
    const saldo=ent+usc;
    const isCorrente=annoCorrente===_annoOggi && m===_meseOggi;
    const vuoto=voceM.length===0;
    const onclick=`apriMese(${m})`;
    h+=`<div class="mese-box${isCorrente?' corrente':''}${vuoto?' vuoto':''}${readonly?' readonly':''}" onclick="${onclick}">
      <div class="mese-nome">${MESI_NOMI[m].slice(0,3).toUpperCase()}</div>`;
    if(!vuoto){
      h+=`<div class="mese-ent">🔋 +${fmtN(ent)}</div>
          <div class="mese-usc">🪫 -${fmtN(Math.abs(usc))}</div>
          <div class="mese-saldo ${saldo>0?'pos':saldo<0?'neg':'zero'}">${saldo>=0?'💵':'💸'} ${fmtImp(saldo)}</div>`;
    } else {
      h+=`<div class="mese-vuoto-label">${readonly?'—':'vuoto'}</div>`;
    }
    h+='</div>';
  }
  h+='</div>';

  document.getElementById('content').innerHTML=h;
}

function apriMese(m){
  meseAperto=m;
  document.getElementById('fab').style.display=isArchiviato(annoCorrente)?'none':'flex';
  renderMeseDettaglio(m);
}

function tornaGriglia(){
  meseAperto=null;
  document.getElementById('fab').style.display='none';
  renderMovimenti();
}

function renderMeseDettaglio(m){
  const readonly=isArchiviato(annoCorrente);
  const ente=intestazione[enteIdx]||'';
  let voceAnno;
  if(readonly){
    voceAnno=(_archivioCache[String(annoCorrente)]||[])
      .filter(v=>intestazione.length===1||!v.membro||v.membro===ente);
  } else {
    voceAnno=voci.filter(v=>(intestazione.length===1||!v.membro||v.membro===ente)&&annoVoce(v)===annoCorrente);
  }
  const voceM=[...voceAnno.filter(v=>meseVoce(v)===m)].sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  const ent=voceM.filter(v=>v.importo>=0).reduce((s,v)=>s+v.importo,0);
  const usc=voceM.filter(v=>v.importo<0).reduce((s,v)=>s+v.importo,0);
  const saldo=ent+usc;

  let h=`<div class="mese-header">
    <button class="btn-back" onclick="tornaGriglia()">← ${annoCorrente}</button>
    <div class="mese-header-title">${MESI_NOMI[m]}</div>
  </div>`;

  h+=`<div class="mese-totali">
    <div class="mt-item"><div class="mt-label">Entrate</div><div class="mt-val pos">+${fmtN(ent)}</div></div>
    <div class="mt-sep"></div>
    <div class="mt-item"><div class="mt-label">Uscite</div><div class="mt-val neg">-${fmtN(Math.abs(usc))}</div></div>
    <div class="mt-sep"></div>
    <div class="mt-item"><div class="mt-label">Saldo</div><div class="mt-val ${saldo>=0?'sp':'sn'}">${fmtImp(saldo)}</div></div>
  </div>`;

  if(!voceM.length){
    h+=`<div class="empty"><div class="empty-icon">💸</div><div class="empty-text">Nessun movimento</div><div class="empty-sub">${readonly?'Anno archiviato':'Tocca + per aggiungere'}</div></div>`;
  } else {
    voceM.forEach(v=>{
      const pos=v.importo>=0;
      h+=`<div class="voce-card${readonly?' readonly':''}">
        <div class="voce-card-left">
          <div class="voce-cat">${v.cat||''}</div>
          <div class="voce-desc">${v.desc||'—'}</div>
          <div class="voce-meta">${fmtData(v.data)}${intestazione.length>1&&v.membro?' · '+v.membro:''}${v.sc?' · 🧾':''}</div>
        </div>
        <span class="voce-imp ${pos?'pos':'neg'}">${fmtImp(v.importo)}</span>
        ${readonly?'':'<button class="voce-edit-btn" onclick="apriEdit('+v.id+')">✏️</button>'}
      </div>`;
    });
  }
  document.getElementById('content').innerHTML=h;
}

function setEnte(i){ enteIdx=i; meseAperto=null; renderAppbar(); render(); }
function setAnno(a){ annoCorrente=a; meseAperto=null; render(); }

// ── BILANCIO ─────────────────────────────────────────────────
function renderBilancio(){
  document.getElementById('fab').style.display='none';
  const ente=intestazione[enteIdx]||'';
  const vociFiltrate=voci.filter(v=>intestazione.length===1||!v.membro||v.membro===ente);
  const anni=tuttiGliAnni(vociFiltrate);
  if(!anni.includes(annoCorrente)) annoCorrente=anni[0]||new Date().getFullYear();

  let voceAnno, readonly;
  if(isArchiviato(annoCorrente)){
    voceAnno=(_archivioCache[String(annoCorrente)]||[])
      .filter(v=>intestazione.length===1||!v.membro||v.membro===ente);
    readonly=true;
  } else {
    voceAnno=vociFiltrate.filter(v=>annoVoce(v)===annoCorrente);
    readonly=false;
  }

  let totEnt=0,totUsc=0;
  voceAnno.forEach(v=>{ if(v.importo>=0) totEnt+=v.importo; else totUsc+=v.importo; });
  const saldo=totEnt+totUsc;

  const catMap={};
  voceAnno.forEach(v=>{
    const c=v.cat||'Altro';
    if(!catMap[c]) catMap[c]={tot:0,voci:[]};
    catMap[c].tot+=v.importo; catMap[c].voci.push(v);
  });

  let h='';
  if(intestazione.length>1){
    h+='<div class="chip-bar">';
    intestazione.forEach((e,i)=>h+=`<button class="chip${i===enteIdx?' active':''}" onclick="setEnteB(${i})">${e}</button>`);
    h+='</div>';
  }
  h+='<div class="anno-chip-bar">';
  anni.forEach(a=>{
    const arch=isArchiviato(a);
    h+=`<button class="anno-chip${a===annoCorrente?' active':''}${arch?' archiviato':''}" onclick="setAnnoB(${a})">${arch?'📦 ':''}${a}</button>`;
  });
  h+='</div>';

  if(readonly){
    h+=`<div class="banner-archivio">
      <span>📦 Archivio ${annoCorrente} — sola lettura</span>
      <button class="btn-disarchivia" onclick="disarchivia(${annoCorrente})">↩️ Disarchivia</button>
    </div>`;
  }

  h+=`<div class="totali-bar">
    <div class="totale-item"><div class="totale-label">Entrate</div><div class="totale-val pos">+${fmtN(totEnt)}</div></div>
    <div class="totale-sep"></div>
    <div class="totale-item"><div class="totale-label">Uscite</div><div class="totale-val neg">-${fmtN(Math.abs(totUsc))}</div></div>
    <div class="totale-sep"></div>
    <div class="totale-item"><div class="totale-label">Saldo</div><div class="totale-val ${saldo>=0?'saldo-pos':'saldo-neg'}">${fmtImp(saldo)}</div></div>
  </div>`;

  h+=`<button class="condividi-btn" onclick="apriCondividi()">📤 Condividi resoconto ${annoCorrente}</button>`;

  if(!voceAnno.length){
    h+=`<div class="empty"><div class="empty-icon">📊</div><div class="empty-text">Nessun movimento ${annoCorrente}</div></div>`;
  } else {
    Object.entries(catMap).sort((a,b)=>Math.abs(b[1].tot)-Math.abs(a[1].tot)).forEach(([cat,data])=>{
      const exp=!!bilExpand[cat];
      const pos=data.tot>=0;
      const sorted=[...data.voci].sort((a,b)=>(b.data||'').localeCompare(a.data||''));
      h+=`<div class="bil-card">
        <div class="bil-card-head" onclick="toggleBil('${cat.replace(/'/g,"\\'")}')">
          <div>
            <div class="bil-cat-nome">${cat}</div>
            <div class="bil-cat-count">${data.voci.length} movimento${data.voci.length!==1?'i':''}</div>
          </div>
          <span class="bil-cat-val" style="color:${pos?'var(--green)':'var(--red)'}">${fmtImp(data.tot)}</span>
        </div>`;
      if(exp){
        h+='<div class="bil-voci">';
        sorted.forEach(v=>{
          h+=`<div class="bil-voce-row">
            <div style="flex:1;min-width:0">
              <div class="bil-voce-desc">${v.desc||'—'}</div>
              <div class="bil-voce-meta">${fmtData(v.data)}${intestazione.length>1&&v.membro?' · '+v.membro:''}</div>
            </div>
            <span class="bil-voce-imp" style="color:${v.importo>=0?'var(--green)':'var(--red)'}">${fmtImp(v.importo)}</span>
          </div>`;
        });
        h+='</div>';
      }
      h+='</div>';
    });
  }

  const annoOggi=new Date().getFullYear();
  if(!readonly && annoCorrente<annoOggi && voceAnno.length){
    h+=`<button class="btn-archivia" onclick="archivia(${annoCorrente})">📦 Archivia anno ${annoCorrente}</button>`;
  }

  document.getElementById('content').innerHTML=h;
}

function setEnteB(i){ enteIdx=i; renderAppbar(); renderBilancio(); }
function setAnnoB(a){ annoCorrente=a; renderBilancio(); }
function toggleBil(cat){ bilExpand[cat]=!bilExpand[cat]; renderBilancio(); }

// ── ARCHIVIA / DISARCHIVIA ───────────────────────────────────
function archivia(anno){
  if(!confirm(`Archiviare tutti i movimenti del ${anno}?\nSaranno sola lettura fino a disarchiviazione.`)) return;
  if(!_fbArchivia){ alert('Firebase non ancora pronto, riprova.'); return; }
  const daDaArchiviare=voci.filter(v=>annoVoce(v)===anno);
  if(!daDaArchiviare.length){ alert('Nessuna voce per questo anno.'); return; }
  voci=voci.filter(v=>annoVoce(v)!==anno);
  salva();
  _fbArchivia(anno, daDaArchiviare);
  _archivioCache[String(anno)]=daDaArchiviare;
  render();
}
function disarchivia(anno){
  if(!confirm(`Disarchiviare il ${anno}?\nI movimenti torneranno modificabili.`)) return;
  if(!_fbDisarchivia){ alert('Firebase non ancora pronto, riprova.'); return; }
  const archiviate=_archivioCache[String(anno)]||[];
  const maxId=voci.length?Math.max(...voci.map(v=>v.id||0)):0;
  archiviate.forEach((v,i)=>{ voci.push({...v,id:maxId+i+1}); });
  delete _archivioCache[String(anno)];
  salva();
  _fbDisarchivia(anno);
  render();
}

// ── MODAL VOCE ───────────────────────────────────────────────
function apriFab(){
  if(tab==='movimenti')      apriNuovaVoce();
  else if(tab==='categorie') apriCat(null);
  else if(tab==='scontrini') scScatta();
}
function apriNuovaVoce(){
  _editId=null;
  document.getElementById('m-voce-title').textContent='Nuovo movimento';
  document.getElementById('v-importo').value='';
  // data preimpostata al mese aperto
  let dataDefault=oggi();
  if(meseAperto!==null){
    const d=new Date(); d.setFullYear(annoCorrente); d.setMonth(meseAperto); d.setDate(1);
    // usa giorno odierno se stesso mese/anno, altrimenti 1
    const ogg=new Date();
    if(annoCorrente===ogg.getFullYear()&&meseAperto===ogg.getMonth()){
      dataDefault=oggi();
    } else {
      dataDefault=`${annoCorrente}-${String(meseAperto+1).padStart(2,'0')}-01`;
    }
  }
  document.getElementById('v-data').value=dataDefault;
  document.getElementById('v-desc').value='';
  document.getElementById('btn-del-voce').style.display='none';
  setSegno(-1); riempiCat(); riempiMembro();
  apri('m-voce');
  setTimeout(()=>document.getElementById('v-importo').focus(),300);
}
function apriEdit(id){
  const v=voci.find(x=>x.id===id); if(!v) return;
  _editId=id;
  document.getElementById('m-voce-title').textContent='Modifica movimento';
  document.getElementById('v-importo').value=Math.abs(v.importo);
  document.getElementById('v-data').value=v.data||oggi();
  document.getElementById('v-desc').value=v.desc||'';
  document.getElementById('btn-del-voce').style.display='block';
  setSegno(v.importo>=0?1:-1); riempiCat(v.cat); riempiMembro(v.membro);
  apri('m-voce');
}
function riempiCat(sel){
  document.getElementById('v-cat').innerHTML=categorie.map(c=>`<option${c===sel?' selected':''}>${c}</option>`).join('');
}
function riempiMembro(sel){
  const grp=document.getElementById('v-membro-group');
  grp.style.display=intestazione.length>1?'':'none';
  document.getElementById('v-membro').innerHTML=intestazione.map(e=>`<option${e===sel?' selected':''}>${e}</option>`).join('');
  if(!sel) document.getElementById('v-membro').value=intestazione[enteIdx]||intestazione[0]||'';
}
function setSegno(s){
  _segno=s;
  document.getElementById('btn-ent').className='sign-btn'+(s===1?' ent':'');
  document.getElementById('btn-usc').className='sign-btn'+(s===-1?' usc':'');
}
function salvaVoce(){
  const imp=parseFloat(document.getElementById('v-importo').value);
  if(isNaN(imp)||imp<=0) return alert('Inserisci un importo valido');
  const cat    =document.getElementById('v-cat').value||categorie[0]||'';
  const desc   =document.getElementById('v-desc').value.trim();
  const data   =document.getElementById('v-data').value||oggi();
  const membro =intestazione.length>1?document.getElementById('v-membro').value:intestazione[0]||'';
  const importo=_segno*imp;
  if(_editId!=null){
    const v=voci.find(x=>x.id===_editId);
    if(v){ v.importo=importo; v.cat=cat; v.desc=desc; v.data=data; v.membro=membro; }
  } else {
    voci.push({id:nextId(),importo,cat,desc,data,membro});
  }
  salva(); chiudi('m-voce'); render();
}
function eliminaVoce(){
  voci=voci.filter(v=>v.id!==_editId);
  salva(); chiudi('m-voce'); render();
}

// ── MODAL CATEGORIA ──────────────────────────────────────────
function apriCat(idx){
  _editCatIdx=idx;
  document.getElementById('m-cat-title').textContent=idx!=null?'Modifica categoria':'Nuova categoria';
  document.getElementById('cat-nome').value=idx!=null?categorie[idx]:'';
  document.getElementById('btn-del-cat').style.display=idx!=null?'block':'none';
  apri('m-cat');
}
function salvaCat(){
  const nome=document.getElementById('cat-nome').value.trim();
  if(!nome) return alert('Inserisci un nome');
  if(_editCatIdx!=null){
    const old=categorie[_editCatIdx];
    categorie[_editCatIdx]=nome;
    voci.forEach(v=>{ if(v.cat===old) v.cat=nome; });
  } else { categorie.push(nome); }
  salva(); chiudi('m-cat'); renderCategorie();
}
function eliminaCat(){ categorie.splice(_editCatIdx,1); salva(); chiudi('m-cat'); renderCategorie(); }
function delCatDiretto(i){ _editCatIdx=i; eliminaCat(); }

// ── CONDIVIDI ────────────────────────────────────────────────
function apriCondividi(){
  document.getElementById('condividi-body').innerHTML=`
    <button class="condividi-btn" onclick="condividi('riepilogo')">📋 Riepilogo per categoria ${annoCorrente}</button>
    <button class="condividi-btn" onclick="condividi('dettaglio')">📄 Dettaglio completo ${annoCorrente}</button>`;
  apri('m-condividi');
}
function condividi(tipo){
  const ente=intestazione[enteIdx]||intestazione[0]||'Famiglia';
  let filtrate;
  if(isArchiviato(annoCorrente)){
    filtrate=(_archivioCache[String(annoCorrente)]||[]).filter(v=>intestazione.length===1||!v.membro||v.membro===ente);
  } else {
    filtrate=voci.filter(v=>(intestazione.length===1||!v.membro||v.membro===ente)&&annoVoce(v)===annoCorrente);
  }
  let totEnt=0,totUsc=0;
  filtrate.forEach(v=>{ if(v.importo>=0) totEnt+=v.importo; else totUsc+=v.importo; });
  let txt=`${emojiApp} ${titoloApp}\n`;
  if(intestazione.length>1) txt+=`👤 ${ente}\n`;
  txt+=`📅 ${annoCorrente}${isArchiviato(annoCorrente)?' 📦':''}\n\n`;
  if(tipo==='riepilogo'){
    const catMap={};
    filtrate.forEach(v=>{ const c=v.cat||'Altro'; catMap[c]=(catMap[c]||0)+v.importo; });
    Object.entries(catMap).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])).forEach(([c,val])=>txt+=`▸ ${c}: ${fmtImp(val)}\n`);
  } else {
    [...filtrate].sort((a,b)=>(a.data||'').localeCompare(b.data||'')).forEach(v=>{
      txt+=`▸ ${fmtData(v.data)} – ${v.cat||''} – ${v.desc||'—'}: ${fmtImp(v.importo)}\n`;
    });
  }
  txt+=`\n📈 Entrate: +${fmtN(totEnt)}\n📉 Uscite: -${fmtN(Math.abs(totUsc))}\n💰 Saldo: ${fmtImp(totEnt+totUsc)}`;
  if(navigator.share) navigator.share({title:`${titoloApp} ${annoCorrente}`,text:txt});
  else navigator.clipboard.writeText(txt).then(()=>alert('Testo copiato!'));
}

function esportaJSON(){
  const d=JSON.stringify({categorie,voci,intestazione,titoloApp,emojiApp,esportatoIl:new Date().toISOString()},null,2);
  const a=document.createElement('a');
  a.href='data:application/json,'+encodeURIComponent(d);
  a.download=`conti_famiglia_${oggi()}.json`; a.click();
}
function importaJSON(){ document.getElementById('file-import').click(); }
function leggiJSON(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const d=JSON.parse(ev.target.result);
      if(d.voci)         voci=d.voci;
      if(d.categorie)    categorie=d.categorie;
      if(d.intestazione) intestazione=d.intestazione;
      if(d.titoloApp)    titoloApp=d.titoloApp;
      if(d.emojiApp)     emojiApp=d.emojiApp;
      salva(); chiudi('m-imp'); render();
    }catch{ alert('File non valido'); }
  };
  r.readAsText(f); e.target.value='';
}

function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function annoSc(s){ return s.anno || parseInt((s.data||'').slice(0,4)) || 0; }
function anniSc(){
  const oggiA=new Date().getFullYear();
  return [...new Set([...scontrini.map(annoSc).filter(Boolean), oggiA])].sort().reverse();
}
function opzioniAnni(sel){

function detr(s){ return s.detraibile!=null ? s.detraibile : (s.importo!=null ? s.importo : 0); }

function clusterSc(s){ return s.cluster||'Mediche'; }
// categorie in ordine di impostazione, più eventuali vecchie non più in elenco
function ordinaCluster(lista){
  const usati=[...new Set(lista.map(clusterSc))];
  return [...catDetr.filter(c=>usati.includes(c)), ...usati.filter(c=>!catDetr.includes(c)).sort()];
}
function nomePers(p){ return p||'Persona non indicata'; }

// ── Gestione categorie detrazioni
function apriCluster(){ renderClusterList(); document.getElementById('cluster-nuovo').value=''; apri('m-cluster'); }
function renderClusterList(){
  document.getElementById('cluster-list').innerHTML=catDetr.map((c,i)=>{
    const n=scontrini.filter(s=>clusterSc(s)===c).length;
    return `<div class="ente-item">
      <input class="form-control" value="${esc(c)}" onchange="rinominaCluster(${i},this.value)">
      <span style="font-size:11px;color:var(--muted);flex-shrink:0;width:44px;text-align:center">${n} doc</span>
      <button class="btn-sm btn-ghost" onclick="spostaCluster(${i},-1)" ${i===0?'disabled':''}>↑</button>
      <button class="btn-sm btn-danger" onclick="eliminaCluster(${i})">✕</button>
    </div>`;
  }).join('');
}
function aggiungiCluster(){
  const el=document.getElementById('cluster-nuovo'), v=el.value.trim();
  if(!v) return;
  if(catDetr.some(c=>c.toLowerCase()===v.toLowerCase())) return alert('Categoria già presente');
  catDetr.push(v); el.value=''; salva(); renderClusterList(); render();
}
function rinominaCluster(i,nuovo){
  nuovo=nuovo.trim(); const vecchio=catDetr[i];
  if(!nuovo||nuovo===vecchio){ renderClusterList(); return; }
  if(catDetr.some((c,j)=>j!==i&&c.toLowerCase()===nuovo.toLowerCase())){ alert('Categoria già presente'); renderClusterList(); return; }
  catDetr[i]=nuovo; salva();
  const da=scontrini.filter(s=>clusterSc(s)===vecchio);
  if(da.length&&window._sc) da.forEach(s=>window._sc.aggiorna(s.id,{cluster:nuovo}).catch(()=>{}));
  renderClusterList(); render();
}
function spostaCluster(i,d){
  const j=i+d; if(j<0||j>=catDetr.length) return;
  [catDetr[i],catDetr[j]]=[catDetr[j],catDetr[i]]; salva(); renderClusterList(); render();
}
function eliminaCluster(i){
  const c=catDetr[i], n=scontrini.filter(s=>clusterSc(s)===c).length;
  if(catDetr.length===1) return alert('Serve almeno una categoria.');
  if(n) return alert(`"${c}" è usata da ${n} document${n===1?'o':'i'}: spostali in un'altra categoria o rinominala.`);
  if(!confirm(`Eliminare la categoria "${c}"?`)) return;
  catDetr.splice(i,1); salva(); renderClusterList(); render();
}
function riempiScCluster(sel){
  const l=[...catDetr]; if(sel&&!l.includes(sel)) l.push(sel);
  document.getElementById('sc-cluster').innerHTML=l.map(c=>`<option${c===sel?' selected':''}>${esc(c)}</option>`).join('');
}

function caricaImg(src){
  return new Promise((ok,ko)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=ko; i.src=src; });
}
// Ridimensiona e comprime la foto in JPEG (restituisce un dataURL)
async function comprimi(file,max,qualita){
  const url=URL.createObjectURL(file);
  try{
    const img=await caricaImg(url);
    const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas');
    c.width=Math.round(img.naturalWidth*s); c.height=Math.round(img.naturalHeight*s);
    const ctx=c.getContext('2d');
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height);
    ctx.drawImage(img,0,0,c.width,c.height);
    return c.toDataURL('image/jpeg',qualita);
  } finally { URL.revokeObjectURL(url); }
}
// Foto compressa (< ~650 KB, sotto il limite di 1 MB di Firestore)
async function preparaFoto(file){
  return {full:canvasAJpeg(await fileACanvas(file,2000))};
}
async function fileACanvas(file,max){
  const url=URL.createObjectURL(file);
  try{
    const img=await caricaImg(url);
    const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas');
    c.width=Math.round(img.naturalWidth*s); c.height=Math.round(img.naturalHeight*s);
    const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height);
    x.drawImage(img,0,0,c.width,c.height);
    return c;
  } finally { URL.revokeObjectURL(url); }
}
function canvasAJpeg(src){
  let max=1400, q=0.7, out='';
  for(let i=0;i<6;i++){
    const s=Math.min(1,max/Math.max(src.width,src.height));
    const c=document.createElement('canvas');
    c.width=Math.round(src.width*s); c.height=Math.round(src.height*s);
    const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height);
    x.drawImage(src,0,0,c.width,c.height);
    out=c.toDataURL('image/jpeg',q);
    if(out.length<900000) break;
    q=Math.max(0.4,q-0.1); max-=150;
  }
  return out;
}

// ── RITAGLIO AUTOMATICO + MANUALE ────────────────────────────
// Trova il documento (zona chiara più grande) e ne restituisce i 4 angoli: [alto-sx, alto-dx, basso-dx, basso-sx]
function rilevaDocumento(src){
  const S=220/Math.max(src.width,src.height);
  const w=Math.max(1,Math.round(src.width*S)), h=Math.max(1,Math.round(src.height*S));
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const x=c.getContext('2d'); x.drawImage(src,0,0,w,h);
  const d=x.getImageData(0,0,w,h).data, N=w*h;
  const g=new Uint8Array(N), hist=new Array(256).fill(0);
  for(let i=0;i<N;i++){ const v=(d[i*4]*0.299+d[i*4+1]*0.587+d[i*4+2]*0.114)|0; g[i]=v; hist[v]++; }
  // soglia di Otsu
  let sum=0; for(let i=0;i<256;i++) sum+=i*hist[i];
  let sB=0,wB=0,best=0,t=128;
  for(let i=0;i<256;i++){
    wB+=hist[i]; if(!wB) continue; const wF=N-wB; if(!wF) break;
    sB+=i*hist[i]; const mB=sB/wB, mF=(sum-sB)/wF, v=wB*wF*(mB-mF)*(mB-mF);
    if(v>best){ best=v; t=i; }
  }
  // componente chiara più grande
  const lab=new Int32Array(N); let bestLab=0,bestArea=0,cur=0; const stack=[];
  for(let i=0;i<N;i++){
    if(g[i]<=t||lab[i]) continue;
    cur++; let area=0; stack.push(i); lab[i]=cur;
    while(stack.length){
      const p=stack.pop(); area++;
      const px=p%w, py=(p/w)|0;
      if(px>0&&!lab[p-1]&&g[p-1]>t){ lab[p-1]=cur; stack.push(p-1); }
      if(px<w-1&&!lab[p+1]&&g[p+1]>t){ lab[p+1]=cur; stack.push(p+1); }
      if(py>0&&!lab[p-w]&&g[p-w]>t){ lab[p-w]=cur; stack.push(p-w); }
      if(py<h-1&&!lab[p+w]&&g[p+w]>t){ lab[p+w]=cur; stack.push(p+w); }
    }
    if(area>bestArea){ bestArea=area; bestLab=cur; }
  }
  if(bestArea<N*0.04||bestArea>N*0.97) return null;
  let tl=null,tr=null,br=null,bl=null;
  for(let i=0;i<N;i++){
    if(lab[i]!==bestLab) continue;
    const px=i%w, py=(i/w)|0;
    if(!tl||px+py<tl.x+tl.y) tl={x:px,y:py};
    if(!br||px+py>br.x+br.y) br={x:px,y:py};
    if(!tr||px-py>tr.x-tr.y) tr={x:px,y:py};
    if(!bl||px-py<bl.x-bl.y) bl={x:px,y:py};
  }
  return [tl,tr,br,bl].map(p=>({x:(p.x+0.5)/S, y:(p.y+0.5)/S}));
}

// Raddrizza il quadrilatero in un rettangolo (omografia + interpolazione bilineare)
function raddrizza(src,pts){
  const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
  let W=Math.max(dist(pts[0],pts[1]),dist(pts[3],pts[2]));
  let H=Math.max(dist(pts[0],pts[3]),dist(pts[1],pts[2]));
  const k=Math.min(1,1400/Math.max(W,H)); W=Math.max(20,Math.round(W*k)); H=Math.max(20,Math.round(H*k));
  // omografia destinazione -> sorgente
  const dst=[[0,0],[W,0],[W,H],[0,H]], A=[], B=[];
  for(let i=0;i<4;i++){
    const [u,v]=dst[i], {x,y}=pts[i];
    A.push([u,v,1,0,0,0,-u*x,-v*x]); B.push(x);
    A.push([0,0,0,u,v,1,-u*y,-v*y]); B.push(y);
  }
  for(let i=0;i<8;i++){ // eliminazione di Gauss
    let m=i; for(let r=i+1;r<8;r++) if(Math.abs(A[r][i])>Math.abs(A[m][i])) m=r;
    [A[i],A[m]]=[A[m],A[i]]; [B[i],B[m]]=[B[m],B[i]];
    for(let r=0;r<8;r++){ if(r===i) continue; const f=A[r][i]/A[i][i];
      for(let cc=i;cc<8;cc++) A[r][cc]-=f*A[i][cc]; B[r]-=f*B[i]; }
  }
  const Hm=B.map((b,i)=>b/A[i][i]);
  const sw=src.width, sh=src.height;
  const sd=src.getContext('2d').getImageData(0,0,sw,sh).data;
  const out=document.createElement('canvas'); out.width=W; out.height=H;
  const ox=out.getContext('2d'), od=ox.createImageData(W,H), o=od.data;
  for(let v=0;v<H;v++){
    for(let u=0;u<W;u++){
      const z=Hm[6]*u+Hm[7]*v+1;
      let sx=(Hm[0]*u+Hm[1]*v+Hm[2])/z, sy=(Hm[3]*u+Hm[4]*v+Hm[5])/z;
      sx=Math.min(sw-1.001,Math.max(0,sx)); sy=Math.min(sh-1.001,Math.max(0,sy));
      const x0=sx|0, y0=sy|0, fx=sx-x0, fy=sy-y0, i0=(y0*sw+x0)*4, i1=i0+sw*4, j=(v*W+u)*4;
      for(let ch=0;ch<3;ch++){
        o[j+ch]=(sd[i0+ch]*(1-fx)+sd[i0+4+ch]*fx)*(1-fy)+(sd[i1+ch]*(1-fx)+sd[i1+4+ch]*fx)*fy;
      }
      o[j+3]=255;
    }
  }
  ox.putImageData(od,0,0);
  return out;
}

let _crop=null; // {src, pts, scala, drag, risolvi}
function ritaglia(src){
  return new Promise(risolvi=>{
    const pts=rilevaDocumento(src)||cornice(src);
    _crop={src,pts,risolvi,drag:-1};
    apri('m-crop');
    requestAnimationFrame(cropDisegna);
  });
}
function cornice(src){ const mx=src.width*0.06, my=src.height*0.06;
  return [{x:mx,y:my},{x:src.width-mx,y:my},{x:src.width-mx,y:src.height-my},{x:mx,y:src.height-my}]; }
function cropDisegna(){
  if(!_crop) return;
  const cv=document.getElementById('crop-canvas'), area=document.getElementById('crop-area');
  const {src,pts}=_crop, dpr=window.devicePixelRatio||1;
  const sc=Math.min(area.clientWidth/src.width, area.clientHeight/src.height);
  _crop.scala=sc;
  cv.style.width=src.width*sc+'px'; cv.style.height=src.height*sc+'px';
  cv.width=Math.round(src.width*sc*dpr); cv.height=Math.round(src.height*sc*dpr);
  const x=cv.getContext('2d'), k=sc*dpr;
  x.drawImage(src,0,0,cv.width,cv.height);
  // oscura l'esterno
  x.save(); x.fillStyle='rgba(0,0,0,.55)'; x.beginPath();
  x.rect(0,0,cv.width,cv.height);
  x.moveTo(pts[0].x*k,pts[0].y*k); [3,2,1].forEach(i=>x.lineTo(pts[i].x*k,pts[i].y*k)); x.closePath();
  x.fill('evenodd'); x.restore();
  x.strokeStyle='#52b788'; x.lineWidth=2.5*dpr; x.beginPath();
  pts.forEach((p,i)=>i?x.lineTo(p.x*k,p.y*k):x.moveTo(p.x*k,p.y*k)); x.closePath(); x.stroke();
  pts.forEach(p=>{ x.beginPath(); x.arc(p.x*k,p.y*k,11*dpr,0,7); x.fillStyle='rgba(82,183,136,.35)'; x.fill();
    x.lineWidth=2.5*dpr; x.strokeStyle='#fff'; x.stroke(); });
}
function cropPunto(e){
  const r=document.getElementById('crop-canvas').getBoundingClientRect();
  return {x:(e.clientX-r.left)/_crop.scala, y:(e.clientY-r.top)/_crop.scala};
}
(function(){
  const cv=document.getElementById('crop-canvas');
  cv.addEventListener('pointerdown',e=>{
    if(!_crop) return; const p=cropPunto(e); let m=-1, md=40/_crop.scala;
    _crop.pts.forEach((q,i)=>{ const dd=Math.hypot(q.x-p.x,q.y-p.y); if(dd<md){ md=dd; m=i; } });
    _crop.drag=m; if(m>=0) cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener('pointermove',e=>{
    if(!_crop||_crop.drag<0) return; const p=cropPunto(e);
    _crop.pts[_crop.drag]={x:Math.min(_crop.src.width,Math.max(0,p.x)), y:Math.min(_crop.src.height,Math.max(0,p.y))};
    cropDisegna();
  });
  const fine=()=>{ if(_crop) _crop.drag=-1; };
  cv.addEventListener('pointerup',fine); cv.addEventListener('pointercancel',fine);
  window.addEventListener('resize',()=>{ if(_crop) cropDisegna(); });
})();
function cropRuota(){
  const {src,pts}=_crop, c=document.createElement('canvas');
  c.width=src.height; c.height=src.width;
  const x=c.getContext('2d'); x.translate(c.width,0); x.rotate(Math.PI/2); x.drawImage(src,0,0);
  // ruota anche gli angoli (orario) e riordina da alto-sx
  const r=pts.map(p=>({x:src.height-p.y, y:p.x}));
  _crop.src=c; _crop.pts=[r[3],r[0],r[1],r[2]];
  cropDisegna();
}
function cropFine(azione){
  if(!_crop) return;
  const {src,pts,risolvi}=_crop; _crop=null;
  document.getElementById('m-crop').classList.remove('open');
  if(!azione) return risolvi(null);
  if(azione==='intera') return risolvi(src);
  // ordina gli angoli (alto-sx, alto-dx, basso-dx, basso-sx) nel caso siano stati incrociati
  const cx=pts.reduce((s,p)=>s+p.x,0)/4, cy=pts.reduce((s,p)=>s+p.y,0)/4;
  const ord=[...pts].sort((a,b)=>Math.atan2(a.y-cy,a.x-cx)-Math.atan2(b.y-cy,b.x-cx));
  let s=0; ord.forEach((p,i)=>{ if(p.x+p.y<ord[s].x+ord[s].y) s=i; });
  const q=[0,1,2,3].map(i=>ord[(s+i)%4]);
  risolvi(raddrizza(src,q));
}

function salvaSc(){
  if(!window._sc) return alert('Connessione a Firebase non ancora pronta, riprova tra un attimo.');
  const imp=parseFloat(document.getElementById('sc-importo').value);
  if(isNaN(imp)||imp<=0) return alert("Inserisci l'importo detraibile.");
  const val=Math.round(imp*100)/100;
  const meta={
    tipo:   document.getElementById('sc-tipo').value,
    anno:   parseInt(document.getElementById('sc-anno').value)||new Date().getFullYear(),
    importo:val,
    detraibile:val,
    cluster:document.getElementById('sc-cluster').value||catDetr[0]||'Mediche',
    nota:   document.getElementById('sc-nota').value.trim(),
    persona:document.getElementById('sc-persona').value.trim()
  };
  let p;
  if(_scEditId){
    p=window._sc.aggiorna(_scEditId,meta);
  } else {
    if(!_scFoto) return alert('Foto non pronta');
    p=window._sc.nuovo({...meta,creatoIl:new Date().toISOString()},_scFoto.full);
  }
  window.setSyncStatus('saving');
  p.then(()=>window.setSyncStatus('ok')).catch(err=>{ window.setSyncStatus('err'); alert('Errore nel salvataggio: '+(err.message||err)); });
  scAnno=meta.anno; _ultimoCluster=meta.cluster;
  chiudi('m-sc'); render();
}

function eliminaSc(){
  if(!_scEditId||!window._sc) return;
  if(!confirm('Eliminare definitivamente questa detrazione e la sua foto?')) return;
  window._sc.elimina(_scEditId).catch(err=>alert('Errore: '+(err.message||err)));
  chiudi('m-sc');
}

async function eliminaAnnoSc(anno){
  if(!window._sc) return alert('Connessione a Firebase non ancora pronta, riprova.');
  const lista=scontrini.filter(s=>annoSc(s)===anno);
  if(!lista.length) return;
  const tot=lista.reduce((t,s)=>t+detr(s),0);
  if(!confirm(`Eliminare DEFINITIVAMENTE tutte le ${lista.length} detrazioni del ${anno} (${fmtN(tot)}) e le loro foto?\n\nSe ti servono ancora, genera prima il PDF.`)) return;
  const conferma=prompt(`Per confermare scrivi l'anno: ${anno}`);
  if(conferma===null) return;
  if(conferma.trim()!==String(anno)) return alert('Anno non corretto: non ho eliminato nulla.');
  window.setSyncStatus('saving');
  const esiti=await Promise.allSettled(lista.map(s=>window._sc.elimina(s.id)));
  const errori=esiti.filter(e=>e.status==='rejected').length;
  window.setSyncStatus(errori?'err':'ok');
  alert(errori?`Eliminate ${lista.length-errori} detrazioni, ${errori} non eliminate (riprova).`:`Eliminate ${lista.length} detrazioni del ${anno}.`);
}

// I font standard del PDF non hanno emoji: le togliamo dal testo
function pdfTxt(s){ return String(s??'').replace(/[^\x20-\x7E -ÿ]/g,'').trim(); }
function eur(n){ return n==null?'':n.toFixed(2).replace('.',',')+' EUR'; }

async function generaPdf(){
  const anno=parseInt(document.getElementById('pdf-anno').value);
  const n=parseInt(document.getElementById('pdf-n').value)||6;
  const persone=[...document.querySelectorAll('#pdf-persone input:checked')].map(i=>i.value);
  if(!persone.length) return alert('Seleziona almeno una persona.');
  const sel=scontrini.filter(s=>annoSc(s)===anno&&persone.includes(s.persona||'')&&detr(s)>0)
    .sort((x,y)=>(x.creatoIl||'').localeCompare(y.creatoIl||''));
  if(!sel.length) return alert(`Nessuna detrazione nel ${anno} per le persone scelte.`);
  const multi=persone.length>1;
  const clusters=ordinaCluster(sel);
  const somma=l=>l.reduce((t,s)=>t+detr(s),0);
  const di=(c,p)=>sel.filter(s=>clusterSc(s)===c&&(p===undefined||(s.persona||'')===p));

  const btn=document.getElementById('btn-pdf'); btn.disabled=true;
  document.getElementById('pdf-pronto').style.display='none';
  try{
    btn.textContent='Preparo…';
    await caricaJsPDF();
    const { jsPDF }=window.jspdf;
    const pdf=new jsPDF({unit:'mm',format:'a4'});
    const PW=210, PH=297, M=14, R=PW-M;

    // ── Riepilogo (senza dettaglio)
    let y=M+6;
    pdf.setFont('helvetica','bold'); pdf.setFontSize(17);
    pdf.text(pdfTxt(`${titoloApp} - Detrazioni ${anno}`),M,y); y+=7;
    pdf.setFont('helvetica','normal'); pdf.setFontSize(10);
    pdf.text(pdf.splitTextToSize(pdfTxt(`${multi?'Persone':'Persona'}: ${persone.map(nomePers).join(', ')}   |   Documenti: ${sel.length}`),PW-2*M),M,y); y+=10;

    const riga=(sx,dx,opt={})=>{
      if(opt.fill){ pdf.setFillColor(...opt.fill); pdf.rect(M,y-5,PW-2*M,7.5,'F'); }
      pdf.setFont('helvetica',opt.bold?'bold':'normal'); pdf.setFontSize(opt.size||10.5);
      pdf.text(pdfTxt(sx),M+(opt.ind||2),y); pdf.text(dx,R-2,y,{align:'right'});
      if(opt.line){ pdf.setDrawColor(228,237,230); pdf.line(M,y+2.5,R,y+2.5); }
      y+=opt.h||7.5;
    };
    const verde=[216,243,220];

    if(!multi){
      riga('Categoria','Importo detraibile',{bold:true,fill:verde,size:10});
      clusters.forEach(c=>{ const l=di(c); riga(`${c}  (${l.length} doc.)`,eur(somma(l)),{line:true}); });
      y+=2; pdf.setDrawColor(45,106,79); pdf.line(M,y-5,R,y-5);
      riga(`TOTALE ${nomePers(persone[0])}`,eur(somma(sel)),{bold:true,size:12});
    } else {
      clusters.forEach(c=>{
        if(y>PH-M-40){ pdf.addPage(); y=M+6; }
        riga(c,'',{bold:true,fill:verde,size:11.5});
        persone.forEach(p=>{ const l=di(c,p); if(l.length) riga(`${nomePers(p)}  (${l.length} doc.)`,eur(somma(l)),{ind:6,line:true}); });
        riga(`Totale ${c}`,eur(somma(di(c))),{bold:true,size:10});
        y+=3;
      });
      if(y>PH-M-12-persone.length*7.5){ pdf.addPage(); y=M+6; }
      y+=2;
      riga('Totale per persona','',{bold:true,fill:verde,size:11.5});
      persone.forEach(p=>{ const l=sel.filter(s=>(s.persona||'')===p); riga(nomePers(p),eur(somma(l)),{ind:6,line:true}); });
      y+=2; pdf.setDrawColor(45,106,79); pdf.line(M,y-5,R,y-5);
      riga('TOTALE GENERALE',eur(somma(sel)),{bold:true,size:12.5});
    }

    // ── Immagini: per categoria (e per persona se più persone)
    const gruppi=[];
    if(multi) persone.forEach(p=>clusters.forEach(c=>{ const l=di(c,p); if(l.length) gruppi.push({titolo:`${nomePers(p)} - ${c}`,voci:l}); }));
    else clusters.forEach(c=>gruppi.push({titolo:c,voci:di(c)}));
    const cols=n===9?3:2, rows=n/cols, G=5, capH=7, head=9;
    const cw=(PW-2*M-(cols-1)*G)/cols, ch=(PH-2*M-head-(rows-1)*G)/rows;
    let fatte=0;
    for(const g of gruppi){
      for(let i=0;i<g.voci.length;i++){
        btn.textContent=`Foto ${++fatte} di ${sel.length}…`;
        const s=g.voci[i];
        if(i%n===0){
          pdf.addPage();
          pdf.setFont('helvetica','bold'); pdf.setFontSize(12);
          pdf.text(pdfTxt(g.titolo+(i>0?' (segue)':'')),M,M+5);
          pdf.setFont('helvetica','normal'); pdf.setFontSize(10);
          pdf.text(eur(somma(g.voci)),R,M+5,{align:'right'});
        }
        const p=i%n, x=M+(p%cols)*(cw+G), yy=M+head+Math.floor(p/cols)*(ch+G);
        let src=null;
        try{ src=await window._sc.immagine(s.id); }catch{}
        const boxH=ch-capH;
        if(src){
          const img=await caricaImg(src);
          const r=Math.min(cw/img.naturalWidth, boxH/img.naturalHeight);
          const w=img.naturalWidth*r, hh=img.naturalHeight*r;
          pdf.addImage(src,'JPEG',x+(cw-w)/2,yy+(boxH-hh)/2,w,hh,undefined,'FAST');
        }
        pdf.setDrawColor(200); pdf.rect(x,yy,cw,boxH);
        pdf.setFont('helvetica','bold'); pdf.setFontSize(8);
        pdf.text(pdf.splitTextToSize(`${eur(detr(s))}  ${pdfTxt(s.tipo||'')}${multi?'':'  '+pdfTxt(nomePers(s.persona))}`,cw)[0],x,yy+boxH+3.5);
        if(s.nota){ pdf.setFont('helvetica','normal'); pdf.text(pdf.splitTextToSize(pdfTxt(s.nota),cw)[0]||'',x,yy+boxH+6.8); }
      }
    }

    _pdfBlob=pdf.output('blob');
    _pdfNome=`detrazioni_${anno}${multi?'':'_'+nomePers(persone[0]).replace(/\W+/g,'_')}.pdf`;
    btn.textContent='✅ PDF pronto ('+Math.round(_pdfBlob.size/1024)+' KB) - rigenera';
    document.getElementById('pdf-pronto').style.display='block';
    mostraAnteprima();
  }catch(err){
    alert('Errore nella creazione del PDF: '+(err.message||err));
    btn.textContent='Genera PDF';
  } finally { btn.disabled=false; }
}

let _pdfjsP=null;
function caricaPdfJs(){
  if(window.pdfjsLib) return Promise.resolve();
  if(!_pdfjsP) _pdfjsP=new Promise((ok,ko)=>{
    const base='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/';
    const s=document.createElement('script');
    s.src=base+'pdf.min.js';
    s.onload=()=>{ window.pdfjsLib.GlobalWorkerOptions.workerSrc=base+'pdf.worker.min.js'; ok(); };
    s.onerror=()=>{ _pdfjsP=null; ko(new Error('Impossibile caricare il visualizzatore (sei online?)')); };
    document.head.appendChild(s);
  });
  return _pdfjsP;
}

async function mostraAnteprima(){
  if(!_pdfBlob) return;
  const box=document.getElementById('anteprima-pagine');
  box.innerHTML='<div class="sc-wait">⏳ Preparo l\'anteprima…</div>';
  document.getElementById('anteprima-titolo').textContent='Anteprima PDF';
  apri('m-anteprima');
  try{
    await caricaPdfJs();
    const doc=await window.pdfjsLib.getDocument({data:new Uint8Array(await _pdfBlob.arrayBuffer())}).promise;
    document.getElementById('anteprima-titolo').textContent=`Anteprima PDF · ${doc.numPages} pagin${doc.numPages===1?'a':'e'}`;
    box.innerHTML='';
    const larghezza=(box.clientWidth-20)*(window.devicePixelRatio||1);
    for(let i=1;i<=doc.numPages;i++){
      const page=await doc.getPage(i);
      const vp0=page.getViewport({scale:1});
      const vp=page.getViewport({scale:larghezza/vp0.width});
      const c=document.createElement('canvas');
      c.width=Math.floor(vp.width); c.height=Math.floor(vp.height);
      box.appendChild(c);
      await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
    }
  }catch(err){
    box.innerHTML=`<div class="sc-wait">Anteprima non disponibile: ${esc(err.message||err)}<br><br>Puoi comunque condividere o scaricare il PDF.</div>`;
  }
}

async function condividiPdf(){
  if(!_pdfBlob) return;
  const f=new File([_pdfBlob],_pdfNome,{type:'application/pdf'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){
    try{ await navigator.share({files:[f],title:_pdfNome}); return; }
    catch(e){ if(e.name==='AbortError') return; }
  }
  window.open(URL.createObjectURL(_pdfBlob),'_blank');
}
function scaricaPdf(){
  if(!_pdfBlob) return;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(_pdfBlob); a.download=_pdfNome; a.click();
}

// ── UTILS ────────────────────────────────────────────────────
function apri(id){ document.getElementById(id).classList.add('open'); }
function chiudi(id,e){ if(e&&e.target.id!==id) return; document.getElementById(id).classList.remove('open'); }
function oggi(){ return new Date().toISOString().slice(0,10); }
function fmtData(d){ if(!d) return '—'; const [y,m,g]=d.split('-'); return `${g}/${m}/${y}`; }
function fmtN(n){ return Math.abs(n).toFixed(2).replace('.',',')+' €'; }
function fmtImp(n){ if(n==null) return '—'; return (n>=0?'+':'-')+fmtN(n); }

// ── CONTROLLO VERSIONE ───────────────────────────────────────
async function controllaVersione(){
  try{
    const r = await fetch('./version.json?t=' + Date.now());
    if(!r.ok) return;
    const d = await r.json();
    const remota = d.version || '';
    if(remota && remota !== APP_VERSION){
      const banner = document.getElementById('banner-update');
      document.getElementById('banner-text').textContent =
        '🔄 Versione ' + remota + ' disponibile (hai ' + APP_VERSION + ')';
      banner.style.display = 'flex';
      // sposta il content sotto il banner
      document.getElementById('content').style.marginTop =
        (60 + banner.offsetHeight + 4) + 'px';
    }
  }catch{}
}

function aggiornaApp(){
  if('serviceWorker' in navigator){
    navigator.serviceWorker.getRegistrations().then(regs=>{
      regs.forEach(r=>r.unregister());
      caches.keys().then(ks=>Promise.all(ks.map(k=>caches.delete(k)))).then(()=>{
        window.location.reload(true);
      });
    });
  } else {
    window.location.reload(true);
  }
}

// ── AVVIO ────────────────────────────────────────────────────
caricaLocale();
render();
controllaVersione();

<script type="module">
import { initializeApp }                                           from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js';
import { getFirestore, doc, setDoc, deleteDoc, getDocs, getDoc, updateDoc, collection, onSnapshot } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey:            "AIzaSyD44NW4GAqepOvB_XfNKWzaTxrOt3spyRc",
  authDomain:        "bilancio-casa-981f2.firebaseapp.com",
  projectId:         "bilancio-casa-981f2",
  storageBucket:     "bilancio-casa-981f2.firebasestorage.app",
  messagingSenderId: "960581445744",
  appId:             "1:960581445744:web:04ca0e66261bed31e52cb5"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);
const COL = 'conti-famiglia';
const DOC = doc(db, COL, 'dati');

let _primoSnap=true, _mioTs='';

const fbSalva = async dati=>{
  try{
    window.setSyncStatus('saving');
    const ts=new Date().toISOString();
    await setDoc(DOC,{...dati,aggiornatoIl:ts});
    _mioTs=ts; localStorage.setItem('cf_lastSave',ts);
    window.setSyncStatus('ok');
  }catch{ window.setSyncStatus('err'); }
};

const fbArchivia = async (anno, voceArchiviate)=>{
  try{
    window.setSyncStatus('saving');
    await setDoc(doc(db,COL,`archivio_${anno}`),{voci:voceArchiviate,anno,archiviatoIl:new Date().toISOString()});
    window.setSyncStatus('ok');
  }catch{ window.setSyncStatus('err'); }
};

const fbDisarchivia = async anno=>{
  try{
    window.setSyncStatus('saving');
    await deleteDoc(doc(db,COL,`archivio_${anno}`));
    window.setSyncStatus('ok');
  }catch{ window.setSyncStatus('err'); }
};

window._fbPronto(fbSalva);
window._fbProntoArchivio(fbArchivia, fbDisarchivia);

const caricaArchivi = async ()=>{
  try{
    const snap=await getDocs(collection(db,COL));
    const cache={};
    snap.forEach(d=>{ if(d.id.startsWith('archivio_')){ cache[d.id.replace('archivio_','')]=d.data().voci||[]; } });
    window.applicaArchivi(cache);
  }catch{}
};

onSnapshot(DOC, snap=>{
  if(!snap.exists()){ fbSalva(window._getStato()); _primoSnap=false; return; }
  const d=snap.data(); const remoto=d.aggiornatoIl||'';
  if(_primoSnap){
    _primoSnap=false;
    const loc=localStorage.getItem('cf_lastSave')||'';
    if(remoto>=loc){ _mioTs=remoto; localStorage.setItem('cf_lastSave',remoto); window.applicaDati(d); window.setSyncStatus('ok'); }
    else fbSalva(window._getStato());
    caricaArchivi();
    return;
  }
  if(remoto!==_mioTs){ _mioTs=remoto; window.applicaDati(d); window.setSyncStatus('ok'); }
}, ()=>window.setSyncStatus('err'));

// ── SCONTRINI ────────────────────────────────────────────────
// Metadati + miniatura in una collezione (lista veloce),
// foto intera in un'altra (scaricata solo quando serve).
const COL_SC  = 'conti-famiglia-scontrini';
const COL_IMG = 'conti-famiglia-scontrini-img';
const _imgCache = {};

window._sc = {
  nuovo: async (meta, full)=>{
    const ref = doc(collection(db, COL_SC));
    _imgCache[ref.id] = full;
    await Promise.all([ setDoc(doc(db, COL_IMG, ref.id), { img: full }), setDoc(ref, meta) ]);
  },
  aggiorna: (id, meta)=> updateDoc(doc(db, COL_SC, id), meta),
  elimina: async id=>{
    delete _imgCache[id];
    await Promise.all([ deleteDoc(doc(db, COL_SC, id)), deleteDoc(doc(db, COL_IMG, id)) ]);
  },
  immagine: async id=>{
    if(_imgCache[id]) return _imgCache[id];
    const s = await getDoc(doc(db, COL_IMG, id));
    const img = s.exists() ? s.data().img : null;
    if(img) _imgCache[id] = img;
    return img;
  }
};

onSnapshot(collection(db, COL_SC), snap=>{
  window.applicaScontrini(snap.docs.map(d=>({ id: d.id, ...d.data() })));
}, ()=>window.setSyncStatus('err'));

if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
