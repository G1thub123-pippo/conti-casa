<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Conti Famiglia</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2d6a4f">
<meta name="mobile-web-app-capable" content="true">
<meta name="apple-mobile-web-app-capable" content="true">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Conti Famiglia">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f0f4f1;color:#1a2e22;min-height:100vh;overflow-x:hidden}
:root{
  --bg:#f0f4f1;
  --bg2:#e4ede6;
  --surface:#ffffff;
  --surface2:#f7faf8;
  --primary:#2d6a4f;
  --primary-light:#52b788;
  --primary-pale:#d8f3dc;
  --accent:#f77f00;
  --text:#1a2e22;
  --text2:#4a6355;
  --muted:#8aab96;
  --green:#2d9e5f;
  --red:#e05252;
  --green-pale:#e8f8ef;
  --red-pale:#fdeaea;
  --radius:14px;
  --shadow:0 2px 12px rgba(45,106,79,.10);
}

#appbar{
  position:fixed;top:0;left:0;right:0;z-index:100;
  background:var(--primary);color:#fff;
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;
  padding-top:calc(12px + env(safe-area-inset-top));
  box-shadow:0 2px 8px rgba(45,106,79,.25);
}
#appbar-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
#appbar-emoji{font-size:22px;line-height:1}
#appbar-title{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#appbar-sub{font-size:11px;color:rgba(255,255,255,.75);margin-top:1px}
#appbar-right{display:flex;align-items:center;gap:10px}
#syncDot{width:8px;height:8px;border-radius:50%;background:#666;transition:background .3s;flex-shrink:0}
#btn-edit{background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer}

#tabs{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:#fff;display:flex;
  border-top:1px solid #d4e8da;
  padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -2px 10px rgba(45,106,79,.08);
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:8px 4px;cursor:pointer;
  color:var(--muted);font-size:10px;font-weight:600;gap:3px;
  border:none;background:none;transition:color .2s;
}
.tab.active{color:var(--primary)}
.tab-icon{font-size:20px;line-height:1}

#content{
  margin-top:calc(60px + env(safe-area-inset-top));
  margin-bottom:calc(64px + env(safe-area-inset-bottom));
  padding:14px;min-height:100vh;
}

.chip-bar{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chip-bar::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;
  cursor:pointer;border:1.5px solid var(--primary);background:#fff;color:var(--primary);
  transition:all .15s;
}
.chip.active{background:var(--primary);color:#fff}

.anno-chip-bar{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.anno-chip-bar::-webkit-scrollbar{display:none}
.anno-chip{
  flex-shrink:0;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;
  cursor:pointer;border:1.5px solid var(--primary-light);background:#fff;color:var(--primary);
}
.anno-chip.active{background:var(--primary-light);color:#fff;border-color:var(--primary-light)}

/* VOCE ROW */
.voce-card{
  background:var(--surface);border-radius:var(--radius);
  box-shadow:var(--shadow);margin-bottom:10px;
  display:flex;align-items:center;padding:13px 14px;gap:12px;
}
.voce-card-left{flex:1;min-width:0}
.voce-cat{font-size:11px;font-weight:700;color:var(--primary-light);text-transform:uppercase;letter-spacing:.03em}
.voce-desc{font-size:14px;font-weight:600;color:var(--text);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.voce-meta{font-size:11px;color:var(--muted);margin-top:3px}
.voce-imp{font-size:16px;font-weight:800;flex-shrink:0}
.voce-imp.pos{color:var(--green)}
.voce-imp.neg{color:var(--red)}
.voce-edit-btn{background:none;border:none;font-size:18px;cursor:pointer;color:var(--muted);padding:4px;flex-shrink:0}

/* TOTALI */
.totali-bar{
  background:var(--primary);color:#fff;border-radius:var(--radius);
  padding:16px;margin-bottom:14px;
  display:flex;justify-content:space-between;align-items:center;
}
.totale-item{text-align:center;flex:1}
.totale-label{font-size:10px;opacity:.75;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.totale-val{font-size:17px;font-weight:800;margin-top:3px}
.totale-val.pos{color:#a7f3c8}
.totale-val.neg{color:#fca5a5}
.totale-val.saldo-pos{color:#fff}
.totale-val.saldo-neg{color:#fca5a5}
.totale-sep{width:1px;background:rgba(255,255,255,.2);align-self:stretch}

/* BILANCIO CAT CARD */
.bil-card{
  background:var(--surface);border-radius:var(--radius);
  box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden;
}
.bil-card-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 14px;cursor:pointer;
}
.bil-cat-nome{font-size:14px;font-weight:700;color:var(--text)}
.bil-cat-count{font-size:12px;color:var(--muted);margin-top:2px}
.bil-cat-val{font-size:16px;font-weight:800}
.bil-voci{border-top:1px solid var(--bg2)}
.bil-voce-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:9px 14px;border-bottom:1px solid var(--bg);
}
.bil-voce-row:last-child{border-bottom:none}
.bil-voce-desc{font-size:13px;color:var(--text2);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bil-voce-meta{font-size:11px;color:var(--muted)}
.bil-voce-imp{font-size:13px;font-weight:700;flex-shrink:0;margin-left:8px}

/* FAB */
#fab{
  position:fixed;right:18px;
  bottom:calc(72px + env(safe-area-inset-bottom));
  width:56px;height:56px;border-radius:50%;
  background:var(--accent);color:#fff;
  font-size:28px;border:none;cursor:pointer;
  box-shadow:0 4px 16px rgba(247,127,0,.45);
  display:flex;align-items:center;justify-content:center;
  z-index:99;transition:transform .15s;
}
#fab:active{transform:scale(.92)}

/* MODAL */
.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.modal-bg.open{opacity:1;pointer-events:all}
.modal{
  background:#fff;border-radius:20px 20px 0 0;
  padding:20px 18px;padding-bottom:calc(20px + env(safe-area-inset-bottom));
  width:100%;max-width:540px;max-height:92vh;overflow-y:auto;
  transform:translateY(100%);transition:transform .25s;
}
.modal-bg.open .modal{transform:translateY(0)}
.modal-title{font-size:17px;font-weight:700;color:var(--text);margin-bottom:16px}
.modal-close{float:right;background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted);margin-top:-4px}
.form-group{margin-bottom:14px}
.form-label{font-size:12px;font-weight:700;color:var(--text2);margin-bottom:5px;display:block}
.form-control{
  width:100%;padding:11px 12px;border-radius:10px;
  border:1.5px solid var(--bg2);background:var(--surface2);
  font-size:14px;color:var(--text);outline:none;
  transition:border-color .15s;font-family:inherit;
}
.form-control:focus{border-color:var(--primary)}
.form-row{display:flex;gap:10px}
.form-row .form-group{flex:1}

.sign-toggle{display:flex;gap:8px;margin-bottom:16px}
.sign-btn{
  flex:1;padding:12px;border-radius:10px;border:2px solid var(--bg2);
  font-size:14px;font-weight:700;cursor:pointer;background:#fff;transition:all .15s;
}
.sign-btn.ent{border-color:var(--green);background:var(--green-pale);color:var(--green)}
.sign-btn.usc{border-color:var(--red);background:var(--red-pale);color:var(--red)}

.btn-full{
  width:100%;padding:13px;border-radius:10px;
  background:var(--primary);color:#fff;border:none;
  font-size:15px;font-weight:700;cursor:pointer;margin-top:4px;transition:opacity .15s;
}
.btn-full:active{opacity:.8}
.btn-full.danger{background:var(--red)}

.btn-sm{padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;border:none;cursor:pointer}
.btn-ghost{background:var(--primary-pale);color:var(--primary)}
.btn-danger{background:var(--red-pale);color:var(--red)}

.empty{text-align:center;padding:52px 20px;color:var(--muted)}
.empty-icon{font-size:48px;margin-bottom:12px}
.empty-text{font-size:15px;font-weight:600}
.empty-sub{font-size:13px;margin-top:6px}

.cat-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 14px;background:#fff;border-radius:10px;
  margin-bottom:8px;box-shadow:var(--shadow);
}
.cat-nome{font-size:14px;font-weight:600}
.cat-actions{display:flex;gap:6px}

.ente-item{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ente-item input{flex:1}

.condividi-btn{
  display:flex;align-items:center;gap:8px;
  width:100%;padding:12px 14px;border-radius:10px;
  border:1.5px solid var(--bg2);background:#fff;
  font-size:14px;font-weight:600;cursor:pointer;margin-bottom:8px;
  color:var(--text);text-align:left;transition:background .15s;
}
.condividi-btn:active{background:var(--bg2)}

/* IMPORTO INPUT grande */
.importo-wrap{position:relative;margin-bottom:14px}
.importo-wrap input{
  width:100%;padding:16px 12px 16px 32px;border-radius:10px;
  border:1.5px solid var(--bg2);background:var(--surface2);
  font-size:28px;font-weight:800;color:var(--text);outline:none;
  transition:border-color .15s;font-family:inherit;
}
.importo-wrap input:focus{border-color:var(--primary)}
.importo-euro{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:22px;font-weight:700;color:var(--muted)}

::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--bg2);border-radius:2px}
</style>
</head>
<body>

<div id="appbar">
  <div id="appbar-left">
    <span id="appbar-emoji">🏠</span>
    <div>
      <div id="appbar-title">Conti Famiglia</div>
      <div id="appbar-sub"></div>
    </div>
  </div>
  <div id="appbar-right">
    <div id="syncDot" title="Connessione"></div>
    <button id="btn-edit" onclick="apriImp()">✏️</button>
  </div>
</div>

<div id="content"></div>
<button id="fab" onclick="apriFab()" title="Aggiungi">+</button>

<div id="tabs">
  <button class="tab active" id="tab-movimenti" onclick="setTab('movimenti')">
    <span class="tab-icon">📋</span>Movimenti
  </button>
  <button class="tab" id="tab-bilancio" onclick="setTab('bilancio')">
    <span class="tab-icon">📊</span>Bilancio
  </button>
  <button class="tab" id="tab-categorie" onclick="setTab('categorie')">
    <span class="tab-icon">🏷️</span>Categorie
  </button>
</div>

<!-- MODAL VOCE -->
<div class="modal-bg" id="m-voce" onclick="chiudi('m-voce',event)">
  <div class="modal">
    <button class="modal-close" onclick="chiudi('m-voce')">×</button>
    <div class="modal-title" id="m-voce-title">Nuovo movimento</div>
    <div class="sign-toggle">
      <button class="sign-btn" id="btn-usc" onclick="setSegno(-1)">－ Uscita</button>
      <button class="sign-btn" id="btn-ent" onclick="setSegno(1)">＋ Entrata</button>
    </div>
    <div class="importo-wrap">
      <span class="importo-euro">€</span>
      <input id="v-importo" type="number" step="0.01" min="0" placeholder="0,00" inputmode="decimal">
    </div>
    <div class="form-group">
      <label class="form-label">Categoria</label>
      <select class="form-control" id="v-cat"></select>
    </div>
    <div class="form-group">
      <label class="form-label">Descrizione</label>
      <input class="form-control" id="v-desc" placeholder="es. Supermercato…">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Data</label>
        <input class="form-control" id="v-data" type="date">
      </div>
      <div class="form-group" id="v-membro-group">
        <label class="form-label">Membro</label>
        <select class="form-control" id="v-membro"></select>
      </div>
    </div>
    <button class="btn-full" onclick="salvaVoce()">Salva</button>
    <button class="btn-full danger" id="btn-del-voce" style="margin-top:8px;display:none" onclick="eliminaVoce()">Elimina</button>
  </div>
</div>

<!-- MODAL CATEGORIA -->
<div class="modal-bg" id="m-cat" onclick="chiudi('m-cat',event)">
  <div class="modal">
    <button class="modal-close" onclick="chiudi('m-cat')">×</button>
    <div class="modal-title" id="m-cat-title">Nuova categoria</div>
    <div class="form-group">
      <label class="form-label">Nome categoria</label>
      <input class="form-control" id="cat-nome" placeholder="es. Alimentari…">
    </div>
    <button class="btn-full" onclick="salvaCat()">Salva</button>
    <button class="btn-full danger" id="btn-del-cat" style="margin-top:8px;display:none" onclick="eliminaCat()">Elimina categoria</button>
  </div>
</div>

<!-- MODAL IMPOSTAZIONI -->
<div class="modal-bg" id="m-imp" onclick="chiudi('m-imp',event)">
  <div class="modal">
    <button class="modal-close" onclick="chiudi('m-imp')">×</button>
    <div class="modal-title">Impostazioni</div>
    <div class="form-row">
      <div class="form-group" style="flex:0 0 70px">
        <label class="form-label">Emoji</label>
        <input class="form-control" id="imp-emoji" maxlength="4" style="text-align:center;font-size:20px">
      </div>
      <div class="form-group">
        <label class="form-label">Titolo app</label>
        <input class="form-control" id="imp-titolo">
      </div>
    </div>
    <div class="form-label" style="margin-bottom:8px">Membri / Conti</div>
    <div id="enti-list"></div>
    <button class="btn-sm btn-ghost" onclick="addEnte()" style="margin-bottom:14px">+ Aggiungi membro</button>
    <button class="btn-full" onclick="salvaImp()">Salva impostazioni</button>
    <div style="margin-top:16px;border-top:1px solid var(--bg2);padding-top:14px">
      <div class="form-label" style="margin-bottom:8px">Dati</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn-sm btn-ghost" onclick="esportaJSON()">📤 Esporta JSON</button>
        <button class="btn-sm btn-ghost" onclick="importaJSON()">📥 Importa JSON</button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL CONDIVIDI -->
<div class="modal-bg" id="m-condividi" onclick="chiudi('m-condividi',event)">
  <div class="modal">
    <button class="modal-close" onclick="chiudi('m-condividi')">×</button>
    <div class="modal-title">Condividi resoconto</div>
    <div id="condividi-body"></div>
  </div>
</div>

<input type="file" id="file-import" accept=".json" style="display:none" onchange="leggiJSON(event)">

<script>
// ── STATO ────────────────────────────────────────────────────
let categorie    = ['Alimentari','Casa','Trasporti','Salute','Svago','Abbigliamento','Utenze','Altro'];
let voci         = [];   // array piatto — struttura principale
let intestazione = ['Famiglia'];
let titoloApp    = 'Conti Famiglia';
let emojiApp     = '🏠';

let tab          = 'movimenti';
let enteIdx      = 0;
let annoCorrente = new Date().getFullYear();
let bilExpand    = {};   // cat -> bool (bilancio)

let _editId      = null; // id voce in modifica
let _segno       = -1;   // -1 uscita, 1 entrata
let _editCatIdx  = null;

// ── FIREBASE QUEUE ───────────────────────────────────────────
let _fbSalva = null, _fbCoda = null;
window._getStato = ()=>({categorie, voci, intestazione, titoloApp, emojiApp});
window._fbPronto = fn=>{ _fbSalva=fn; if(_fbCoda){_fbSalva(window._getStato());_fbCoda=null;} };
window.applicaDati = d=>{
  if(d.categorie)    categorie    = d.categorie;
  if(d.voci)         voci         = d.voci;
  if(d.intestazione) intestazione = d.intestazione;
  if(d.titoloApp)    titoloApp    = d.titoloApp;
  if(d.emojiApp)     emojiApp     = d.emojiApp;
  if(enteIdx >= intestazione.length) enteIdx = 0;
  render();
};
window.setSyncStatus = s=>{
  const el=document.getElementById('syncDot'); if(!el) return;
  el.style.background={ok:'#52b788',saving:'#f0a800',err:'#e05252'}[s]||'#666';
  el.title={ok:'Sincronizzato',saving:'Salvataggio…',err:'Offline'}[s]||'';
};

// ── LOCALE ───────────────────────────────────────────────────
function salvaLocale(){
  try{
    localStorage.setItem('cf_cat',   JSON.stringify(categorie));
    localStorage.setItem('cf_voci',  JSON.stringify(voci));
    localStorage.setItem('cf_int',   JSON.stringify(intestazione));
    localStorage.setItem('cf_titolo',titoloApp);
    localStorage.setItem('cf_emoji', emojiApp);
    localStorage.setItem('cf_lastSave', new Date().toISOString());
  }catch{}
}
function caricaLocale(){
  try{
    const c=localStorage.getItem('cf_cat');   if(c) categorie=JSON.parse(c);
    const v=localStorage.getItem('cf_voci');  if(v) voci=JSON.parse(v);
    const i=localStorage.getItem('cf_int');   if(i) intestazione=JSON.parse(i);
    const t=localStorage.getItem('cf_titolo');if(t) titoloApp=t;
    const e=localStorage.getItem('cf_emoji'); if(e) emojiApp=e;
  }catch{}
}
async function saveOPFS(){
  try{
    const root=await navigator.storage.getDirectory();
    const fh=await root.getFileHandle('cf_backup.json',{create:true});
    const w=await fh.createWritable();
    await w.write(JSON.stringify({categorie,voci,intestazione,titoloApp,emojiApp,savedAt:new Date().toISOString()}));
    await w.close();
  }catch{}
}
function salva(){
  salvaLocale(); saveOPFS();
  const s=window._getStato();
  if(_fbSalva) _fbSalva(s); else _fbCoda=s;
}
function nextId(){ return voci.length ? Math.max(...voci.map(v=>v.id||0))+1 : 1; }

// ── RENDER ───────────────────────────────────────────────────
function render(){
  renderAppbar();
  if(tab==='movimenti')  renderMovimenti();
  else if(tab==='bilancio') renderBilancio();
  else                   renderCategorie();
}
function renderAppbar(){
  document.getElementById('appbar-emoji').textContent = emojiApp;
  document.getElementById('appbar-title').textContent = titoloApp;
  document.getElementById('appbar-sub').textContent   = intestazione.length>1 ? intestazione[enteIdx] : '';
}
function setTab(t){
  tab=t;
  document.querySelectorAll('.tab').forEach(el=>el.classList.remove('active'));
  document.getElementById('tab-'+t).classList.add('active');
  render();
}

// ── MOVIMENTI ────────────────────────────────────────────────
function renderMovimenti(){
  document.getElementById('fab').style.display='flex';
  const ente = intestazione[enteIdx]||'';
  const filtrate = voci.filter(v=> intestazione.length===1 || !v.membro || v.membro===ente)
    .sort((a,b)=>(b.data||'').localeCompare(a.data||''));

  let h='';
  if(intestazione.length>1){
    h+='<div class="chip-bar">';
    intestazione.forEach((e,i)=>h+=`<button class="chip${i===enteIdx?' active':''}" onclick="setEnte(${i})">${e}</button>`);
    h+='</div>';
  }
  if(!filtrate.length){
    h+=`<div class="empty"><div class="empty-icon">💸</div><div class="empty-text">Nessun movimento</div><div class="empty-sub">Tocca + per aggiungere</div></div>`;
  } else {
    filtrate.forEach(v=>{
      const pos=v.importo>=0;
      h+=`<div class="voce-card">
        <div class="voce-card-left">
          <div class="voce-cat">${v.cat||''}</div>
          <div class="voce-desc">${v.desc||'—'}</div>
          <div class="voce-meta">${fmtData(v.data)}${intestazione.length>1&&v.membro?' · '+v.membro:''}</div>
        </div>
        <span class="voce-imp ${pos?'pos':'neg'}">${fmtImp(v.importo)}</span>
        <button class="voce-edit-btn" onclick="apriEdit(${v.id})">✏️</button>
      </div>`;
    });
  }
  document.getElementById('content').innerHTML=h;
}
function setEnte(i){ enteIdx=i; renderAppbar(); render(); }

// ── BILANCIO ─────────────────────────────────────────────────
function renderBilancio(){
  document.getElementById('fab').style.display='none';
  const ente = intestazione[enteIdx]||'';
  const filtrate = voci.filter(v=> intestazione.length===1 || !v.membro || v.membro===ente);

  // anni
  const anni=[...new Set(filtrate.map(v=>(v.data||'').slice(0,4)).filter(Boolean))].sort().reverse();
  if(anni.length && !anni.includes(String(annoCorrente))) annoCorrente=parseInt(anni[0]);

  const annoVoci = filtrate.filter(v=>(v.data||'').startsWith(String(annoCorrente)));
  let totEnt=0, totUsc=0;
  annoVoci.forEach(v=>{ if(v.importo>=0) totEnt+=v.importo; else totUsc+=v.importo; });
  const saldo=totEnt+totUsc;

  // aggrega per categoria
  const catMap={};
  annoVoci.forEach(v=>{
    const c=v.cat||'Altro';
    if(!catMap[c]) catMap[c]={tot:0,voci:[]};
    catMap[c].tot+=v.importo;
    catMap[c].voci.push(v);
  });

  let h='';
  if(intestazione.length>1){
    h+='<div class="chip-bar">';
    intestazione.forEach((e,i)=>h+=`<button class="chip${i===enteIdx?' active':''}" onclick="setEnteB(${i})">${e}</button>`);
    h+='</div>';
  }
  h+='<div class="anno-chip-bar">';
  anni.forEach(a=>h+=`<button class="anno-chip${parseInt(a)===annoCorrente?' active':''}" onclick="setAnno(${a})">${a}</button>`);
  h+='</div>';

  h+=`<div class="totali-bar">
    <div class="totale-item"><div class="totale-label">Entrate</div><div class="totale-val pos">+${fmtN(totEnt)}</div></div>
    <div class="totale-sep"></div>
    <div class="totale-item"><div class="totale-label">Uscite</div><div class="totale-val neg">-${fmtN(Math.abs(totUsc))}</div></div>
    <div class="totale-sep"></div>
    <div class="totale-item"><div class="totale-label">Saldo</div><div class="totale-val ${saldo>=0?'saldo-pos':'saldo-neg'}">${fmtImp(saldo)}</div></div>
  </div>`;

  h+=`<button class="condividi-btn" onclick="apriCondividi()">📤 Condividi resoconto ${annoCorrente}</button>`;

  if(!annoVoci.length){
    h+=`<div class="empty"><div class="empty-icon">📊</div><div class="empty-text">Nessun movimento ${annoCorrente}</div></div>`;
  } else {
    // ordina categorie per valore assoluto decrescente
    Object.entries(catMap).sort((a,b)=>Math.abs(b[1].tot)-Math.abs(a[1].tot)).forEach(([cat,data])=>{
      const exp=!!bilExpand[cat];
      const pos=data.tot>=0;
      const sorted=[...data.voci].sort((a,b)=>(b.data||'').localeCompare(a.data||''));
      h+=`<div class="bil-card">
        <div class="bil-card-head" onclick="toggleBil('${cat.replace(/'/g,"\\'")}')">
          <div>
            <div class="bil-cat-nome">${cat}</div>
            <div class="bil-cat-count">${data.voci.length} movimento${data.voci.length!==1?'i':''}</div>
          </div>
          <span class="bil-cat-val" style="color:${pos?'var(--green)':'var(--red)'}">${fmtImp(data.tot)}</span>
        </div>`;
      if(exp){
        h+='<div class="bil-voci">';
        sorted.forEach(v=>{
          h+=`<div class="bil-voce-row">
            <div style="flex:1;min-width:0">
              <div class="bil-voce-desc">${v.desc||'—'}</div>
              <div class="bil-voce-meta">${fmtData(v.data)}${intestazione.length>1&&v.membro?' · '+v.membro:''}</div>
            </div>
            <span class="bil-voce-imp" style="color:${v.importo>=0?'var(--green)':'var(--red)'}">${fmtImp(v.importo)}</span>
          </div>`;
        });
        h+='</div>';
      }
      h+='</div>';
    });
  }
  document.getElementById('content').innerHTML=h;
}
function setEnteB(i){ enteIdx=i; renderAppbar(); renderBilancio(); }
function setAnno(a){ annoCorrente=parseInt(a); renderBilancio(); }
function toggleBil(cat){ bilExpand[cat]=!bilExpand[cat]; renderBilancio(); }

// ── CATEGORIE ────────────────────────────────────────────────
function renderCategorie(){
  document.getElementById('fab').style.display='flex';
  let h='';
  if(!categorie.length){
    h=`<div class="empty"><div class="empty-icon">🏷️</div><div class="empty-text">Nessuna categoria</div></div>`;
  } else {
    categorie.forEach((c,i)=>{
      h+=`<div class="cat-item">
        <span class="cat-nome">${c}</span>
        <div class="cat-actions">
          <button class="btn-sm btn-ghost" onclick="apriCat(${i})">✏️</button>
          <button class="btn-sm btn-danger" onclick="delCatDiretto(${i})">🗑️</button>
        </div>
      </div>`;
    });
  }
  document.getElementById('content').innerHTML=h;
}

// ── MODAL VOCE ───────────────────────────────────────────────
function apriFab(){
  if(tab==='movimenti')  apriNuovaVoce();
  else if(tab==='categorie') apriCat(null);
}
function apriNuovaVoce(){
  _editId=null;
  document.getElementById('m-voce-title').textContent='Nuovo movimento';
  document.getElementById('v-importo').value='';
  document.getElementById('v-data').value=oggi();
  document.getElementById('v-desc').value='';
  document.getElementById('btn-del-voce').style.display='none';
  setSegno(-1);
  riempiCat();
  riempiMembro();
  apri('m-voce');
  setTimeout(()=>document.getElementById('v-importo').focus(),300);
}
function apriEdit(id){
  const v=voci.find(x=>x.id===id); if(!v) return;
  _editId=id;
  document.getElementById('m-voce-title').textContent='Modifica movimento';
  document.getElementById('v-importo').value=Math.abs(v.importo);
  document.getElementById('v-data').value=v.data||oggi();
  document.getElementById('v-desc').value=v.desc||'';
  document.getElementById('btn-del-voce').style.display='block';
  setSegno(v.importo>=0?1:-1);
  riempiCat(v.cat);
  riempiMembro(v.membro);
  apri('m-voce');
}
function riempiCat(sel){
  document.getElementById('v-cat').innerHTML=categorie.map(c=>`<option${c===sel?' selected':''}>${c}</option>`).join('');
}
function riempiMembro(sel){
  const grp=document.getElementById('v-membro-group');
  grp.style.display=intestazione.length>1?'':'none';
  document.getElementById('v-membro').innerHTML=intestazione.map(e=>`<option${e===sel?' selected':''}>${e}</option>`).join('');
  if(!sel) document.getElementById('v-membro').value=intestazione[enteIdx]||intestazione[0]||'';
}
function setSegno(s){
  _segno=s;
  document.getElementById('btn-ent').className='sign-btn'+(s===1?' ent':'');
  document.getElementById('btn-usc').className='sign-btn'+(s===-1?' usc':'');
}
function salvaVoce(){
  const imp=parseFloat(document.getElementById('v-importo').value);
  if(isNaN(imp)||imp<=0) return alert('Inserisci un importo valido');
  const cat    = document.getElementById('v-cat').value||categorie[0]||'';
  const desc   = document.getElementById('v-desc').value.trim();
  const data   = document.getElementById('v-data').value||oggi();
  const membro = intestazione.length>1 ? document.getElementById('v-membro').value : intestazione[0]||'';
  const importo= _segno*imp;
  if(_editId!=null){
    const v=voci.find(x=>x.id===_editId);
    if(v){ v.importo=importo; v.cat=cat; v.desc=desc; v.data=data; v.membro=membro; }
  } else {
    voci.push({id:nextId(),importo,cat,desc,data,membro});
  }
  salva(); chiudi('m-voce'); render();
}
function eliminaVoce(){
  voci=voci.filter(v=>v.id!==_editId);
  salva(); chiudi('m-voce'); render();
}

// ── MODAL CATEGORIA ──────────────────────────────────────────
function apriCat(idx){
  _editCatIdx=idx;
  document.getElementById('m-cat-title').textContent=idx!=null?'Modifica categoria':'Nuova categoria';
  document.getElementById('cat-nome').value=idx!=null?categorie[idx]:'';
  document.getElementById('btn-del-cat').style.display=idx!=null?'block':'none';
  apri('m-cat');
}
function salvaCat(){
  const nome=document.getElementById('cat-nome').value.trim();
  if(!nome) return alert('Inserisci un nome');
  if(_editCatIdx!=null){
    const old=categorie[_editCatIdx];
    categorie[_editCatIdx]=nome;
    voci.forEach(v=>{ if(v.cat===old) v.cat=nome; });
  } else { categorie.push(nome); }
  salva(); chiudi('m-cat'); renderCategorie();
}
function eliminaCat(){
  categorie.splice(_editCatIdx,1);
  salva(); chiudi('m-cat'); renderCategorie();
}
function delCatDiretto(i){ _editCatIdx=i; eliminaCat(); }

// ── IMPOSTAZIONI ─────────────────────────────────────────────
function apriImp(){
  document.getElementById('imp-emoji').value=emojiApp;
  document.getElementById('imp-titolo').value=titoloApp;
  renderEntiList();
  apri('m-imp');
}
function renderEntiList(){
  document.getElementById('enti-list').innerHTML=intestazione.map((e,i)=>`
    <div class="ente-item">
      <input class="form-control" id="ef-${i}" value="${e}" placeholder="Nome membro…">
      <button class="btn-sm btn-danger" onclick="removeEnte(${i})">✕</button>
    </div>`).join('');
}
function addEnte(){ intestazione.push(''); renderEntiList(); }
function removeEnte(i){ intestazione.splice(i,1); if(enteIdx>=intestazione.length) enteIdx=0; renderEntiList(); }
function salvaImp(){
  emojiApp  = document.getElementById('imp-emoji').value.trim()||'🏠';
  titoloApp = document.getElementById('imp-titolo').value.trim()||'Conti Famiglia';
  const nuovi=intestazione.map((_,i)=>{ const el=document.getElementById('ef-'+i); return el?el.value.trim():''; }).filter(Boolean);
  intestazione=nuovi.length?nuovi:['Famiglia'];
  if(enteIdx>=intestazione.length) enteIdx=0;
  salva(); chiudi('m-imp'); render();
}

// ── CONDIVIDI ────────────────────────────────────────────────
function apriCondividi(){
  document.getElementById('condividi-body').innerHTML=`
    <button class="condividi-btn" onclick="condividi('riepilogo')">📋 Riepilogo per categoria ${annoCorrente}</button>
    <button class="condividi-btn" onclick="condividi('dettaglio')">📄 Dettaglio completo ${annoCorrente}</button>`;
  apri('m-condividi');
}
function condividi(tipo){
  const ente=intestazione[enteIdx]||intestazione[0]||'Famiglia';
  const filtrate=voci.filter(v=>(intestazione.length===1||!v.membro||v.membro===ente)&&(v.data||'').startsWith(String(annoCorrente)));
  let totEnt=0,totUsc=0;
  filtrate.forEach(v=>{ if(v.importo>=0) totEnt+=v.importo; else totUsc+=v.importo; });
  let txt=`${emojiApp} ${titoloApp}\n`;
  if(intestazione.length>1) txt+=`👤 ${ente}\n`;
  txt+=`📅 ${annoCorrente}\n\n`;
  if(tipo==='riepilogo'){
    const catMap={};
    filtrate.forEach(v=>{ const c=v.cat||'Altro'; catMap[c]=(catMap[c]||0)+v.importo; });
    Object.entries(catMap).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])).forEach(([c,val])=>{
      txt+=`▸ ${c}: ${fmtImp(val)}\n`;
    });
  } else {
    [...filtrate].sort((a,b)=>(a.data||'').localeCompare(b.data||'')).forEach(v=>{
      txt+=`▸ ${fmtData(v.data)} – ${v.cat||''} – ${v.desc||'—'}: ${fmtImp(v.importo)}\n`;
    });
  }
  txt+=`\n📈 Entrate: +${fmtN(totEnt)}\n📉 Uscite: -${fmtN(Math.abs(totUsc))}\n💰 Saldo: ${fmtImp(totEnt+totUsc)}`;
  if(navigator.share) navigator.share({title:`${titoloApp} ${annoCorrente}`,text:txt});
  else navigator.clipboard.writeText(txt).then(()=>alert('Testo copiato!'));
}

// ── EXPORT / IMPORT ──────────────────────────────────────────
function esportaJSON(){
  const d=JSON.stringify({categorie,voci,intestazione,titoloApp,emojiApp,esportatoIl:new Date().toISOString()},null,2);
  const a=document.createElement('a');
  a.href='data:application/json,'+encodeURIComponent(d);
  a.download=`conti_famiglia_${oggi()}.json`;
  a.click();
}
function importaJSON(){ document.getElementById('file-import').click(); }
function leggiJSON(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const d=JSON.parse(ev.target.result);
      if(d.voci)         voci=d.voci;
      if(d.categorie)    categorie=d.categorie;
      if(d.intestazione) intestazione=d.intestazione;
      if(d.titoloApp)    titoloApp=d.titoloApp;
      if(d.emojiApp)     emojiApp=d.emojiApp;
      salva(); chiudi('m-imp'); render();
    }catch{ alert('File non valido'); }
  };
  r.readAsText(f);
  e.target.value='';
}

// ── UTILS ────────────────────────────────────────────────────
function apri(id){ document.getElementById(id).classList.add('open'); }
function chiudi(id,e){ if(e&&e.target.id!==id) return; document.getElementById(id).classList.remove('open'); }
function oggi(){ return new Date().toISOString().slice(0,10); }
function fmtData(d){ if(!d) return '—'; const [y,m,g]=d.split('-'); return `${g}/${m}/${y}`; }
function fmtN(n){ return Math.abs(n).toFixed(2).replace('.',',')+' €'; }
function fmtImp(n){ if(n==null) return '—'; return (n>=0?'+':'-')+fmtN(n); }

// ── AVVIO ────────────────────────────────────────────────────
caricaLocale();
render();
</script>

<script type="module">
import { initializeApp }                         from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js';
import { getFirestore, doc, setDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey:            "AIzaSyD44NW4GAqepOvB_XfNKWzaTxrOt3spyRc",
  authDomain:        "bilancio-casa-981f2.firebaseapp.com",
  projectId:         "bilancio-casa-981f2",
  storageBucket:     "bilancio-casa-981f2.firebasestorage.app",
  messagingSenderId: "960581445744",
  appId:             "1:960581445744:web:04ca0e66261bed31e52cb5"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);
const DOC = doc(db, 'conti-famiglia', 'dati');

let _primoSnap = true, _mioTs = '';

const fbSalva = async dati => {
  try {
    window.setSyncStatus('saving');
    const ts = new Date().toISOString();
    await setDoc(DOC, { ...dati, aggiornatoIl: ts });
    _mioTs = ts;
    localStorage.setItem('cf_lastSave', ts);
    window.setSyncStatus('ok');
  } catch { window.setSyncStatus('err'); }
};

window._fbPronto(fbSalva);

onSnapshot(DOC, snap => {
  if (!snap.exists()) { fbSalva(window._getStato()); _primoSnap=false; return; }
  const d = snap.data();
  const remoto = d.aggiornatoIl || '';
  if (_primoSnap) {
    _primoSnap = false;
    const loc = localStorage.getItem('cf_lastSave') || '';
    if (remoto >= loc) {
      _mioTs = remoto;
      localStorage.setItem('cf_lastSave', remoto);
      window.applicaDati(d);
      window.setSyncStatus('ok');
    } else { fbSalva(window._getStato()); }
    return;
  }
  if (remoto !== _mioTs) { _mioTs=remoto; window.applicaDati(d); window.setSyncStatus('ok'); }
}, () => window.setSyncStatus('err'));

if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
